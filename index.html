<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>지도 운전 게임</title>

<!-- MapLibre GL JS: 지도를 그려주는 오픈소스 라이브러리 (CDN) -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- turf.js: 위치와 도로 선(line) 사이의 실제 거리(미터)를 계산하기 위한 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

<style>
  /* ===== 기본 레이아웃 ===== */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    touch-action: none; /* 스크롤/확대 등 브라우저 기본 제스처 방지 */
    -webkit-user-select: none;
    user-select: none;
  }

  #map {
    position: fixed;
    inset: 0;
    opacity: 0; /* 처음엔 안 보이다가, 위치를 찾으면 서서히 나타남 */
    transition: opacity 1.8s ease;
  }
  #map.revealed { opacity: 1; }

  /* ===== 화면 정중앙 자동차 ===== */
  #car {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 24px;
    margin-top: -12px;
    margin-left: -7px;
    z-index: 500;
    pointer-events: none;
    transform: rotate(0deg);
    transition: transform 0.05s linear;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
  }
  #car svg { width: 100%; height: 100%; display: block; }

  /* ===== 오른쪽 아래: 원형 핸들(투명 원) - 중심 기준 각도로 방향을 직접 조작 ===== */
  #wheel-zone {
    position: fixed;
    right: 18px;
    bottom: 24px;
    width: 168px;
    height: 168px;
    z-index: 450;
    touch-action: none;
  }
  #wheel-circle {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.55);
    background: rgba(20,33,61,0.30);
    box-sizing: border-box;
  }
  /* 위쪽(정면/0도)을 표시하는 작은 기준 눈금 */
  #wheel-circle::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 6px;
    width: 3px;
    height: 12px;
    margin-left: -1.5px;
    background: rgba(255,255,255,0.6);
    border-radius: 2px;
  }
  #wheel-center-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    margin-top: -6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
  }
  /* 현재 자동차 방향을 가리키는 바늘(needle): 자동차 아이콘과 항상 같은 각도로 회전 */
  #wheel-needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 44%;
    margin-left: -3px;
    background: #ffd166;
    border-radius: 4px;
    transform-origin: 50% 100%;
    transform: translateY(-100%) rotate(0deg);
  }

  /* ===== 왼쪽 아래: 전진 / 멈춤 / 후진 버튼 ===== */
  #controls {
    position: fixed;
    left: 14px;
    bottom: 54px;
    z-index: 600;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .ctrl-btn {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: none;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:active { filter: brightness(1.25); }
  #btn-forward { background: #2a7f62; }
  #btn-stop    { background: #8a2c2c; }
  #btn-reverse { background: #2c4d8a; }
  .ctrl-btn.active-state {
    outline: 2px solid #ffd166;
    outline-offset: 2px;
  }

  /* ===== 전진 버튼 오른쪽: 최고속도 +/- 버튼 ===== */
  #speed-controls {
    position: fixed;
    left: 61px;
    bottom: 101px;
    z-index: 600;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .speed-btn {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: none;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    background: #6b4fa0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    -webkit-tap-highlight-color: transparent;
  }
  .speed-btn:active { filter: brightness(1.25); }

  /* ===== 상단 정보 표시줄 (점수계 + 속도계를 나란히 배치) ===== */
  #hud-row {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #hud, #score-hud {
    background: rgba(13,17,23,0.72);
    color: #eaeaea;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    white-space: nowrap;
  }
  #score-hud {
    color: #ffd166; /* 속도계와 구분되도록 점수는 살짝 강조 색상 */
  }

  /* ===== 우측 상단: 현재 웨이브 표시 ===== */
  #wave-hud {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 600;
    background: rgba(13,17,23,0.72);
    color: #7fd3ff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* 속도 표시 바로 아래의 일시정지 버튼 */
  #pause-btn {
    position: fixed;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 650; /* 도로 이탈/체포 경고 배지보다 위에 오도록 */
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(13,17,23,0.72);
    color: #eaeaea;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }
  #pause-btn:active { filter: brightness(1.3); }
  #pause-btn.is-paused {
    background: rgba(42,127,98,0.9); /* 다시 재생할 수 있음을 알리는 초록색 */
  }

  #offroad-warning {
    position: fixed;
    top: 104px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 600;
    background: rgba(200,40,40,0.85);
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    display: none;
  }

  /* ===== 경찰차 & 추격(경찰과 도둑) 관련 ===== */
  #police-layer {
    position: fixed;
    inset: 0;
    z-index: 480; /* 플레이어 차(500)보다는 아래, 지도(맵)보다는 위 */
    pointer-events: none;
  }
  .police-car {
    position: absolute;
    width: 14px;
    height: 24px;
    left: 0;
    top: 0;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
  }
  .police-car svg { width: 100%; height: 100%; display: block; }
  /* ===== 웨이브6+: 자유롭게 돌아다니는 "길막" 민간 차량(녹색, 경찰차와 동일한 크기) ===== */
  .civilian-car {
    position: absolute;
    width: 14px;
    height: 24px;
    left: 0;
    top: 0;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
  }
  .civilian-car svg { width: 100%; height: 100%; display: block; }
  /* ===== 웨이브4: 특수 경찰 트럭 (직사각형 장애물 차량) ===== */
  .police-truck {
    position: absolute;
    width: 14px;
    height: 44px;
    left: 0;
    top: 0;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .police-truck svg { width: 100%; height: 100%; display: block; }
  /* ===== 웨이브6: 경찰 헬기 - 도로를 무시하고 하늘에서 플레이어에게 직진으로 접근 ===== */
  .police-helicopter {
    position: absolute;
    width: 40px;
    height: 40px;
    left: 0;
    top: 0;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.55));
  }
  .police-helicopter svg { width: 100%; height: 100%; display: block; }
  /* 메인 로터: 늘 같은 속도로 계속 회전(기체 자체의 진행방향 회전과는 무관하게 별도로 빙글빙글 돎) */
  .heli-rotor {
    animation: heli-rotor-spin 0.2s linear infinite;
    transform-origin: 20px 4px;
  }
  @keyframes heli-rotor-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* ===== 웨이브5: 스파이크 스트립(타이어 파열 장치) - 도로 위에 뿌려진 함정 ===== */
  .spike-strip {
    position: absolute;
    width: 26px;
    height: 12px;
    left: 0;
    top: 0;
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
  }
  .spike-strip svg { width: 100%; height: 100%; display: block; }
  /* 경광등 깜빡임: 빨강 ↔ 파랑 교차 */
  .police-light {
    animation: police-blink 0.5s steps(1) infinite;
  }
  @keyframes police-blink {
    0%, 49%   { fill: #ff3b3b; }
    50%, 100% { fill: #3b7bff; }
  }
  /* 경찰차 주변의 큰 원: 순찰 중엔 탐지 범위(초록 테두리만), 추격 중엔 체포 판정 범위(빨강 채움) */
  .catch-circle {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    box-sizing: border-box;
    pointer-events: none;
  }
  .catch-circle.mode-patrol {
    background: transparent;               /* 요청대로 안쪽에는 색을 넣지 않음 */
    border: 3px solid rgba(90, 255, 160, 0.95); /* 선만 초록색으로 - 숲 등 초록 배경에 묻히지 않도록 더 밝고 두껍게 */
  }
  .catch-circle.mode-chase {
    background: rgba(255,40,40,0.16);
    border: 2px solid rgba(255,60,60,0.55);
  }

  #catch-warning {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 601;
    background: rgba(180,20,20,0.9);
    color: #fff;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    display: none;
  }

  #detected-warning {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 602;
    background: rgba(210,30,30,0.95);
    color: #fff;
    padding: 8px 22px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 800;
    display: none;
    animation: detected-flash 0.35s steps(1) infinite;
  }
  @keyframes detected-flash {
    0%, 49%   { background: rgba(210,30,30,0.95); }
    50%, 100% { background: rgba(140,10,10,0.95); }
  }

  #caught-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(13,17,23,0.92);
    color: #eaeaea;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    box-sizing: border-box;
  }
  #caught-overlay h1 { font-size: 22px; margin-bottom: 10px; color: #ff5a5f; }
  #caught-overlay p { font-size: 14px; color: #a9b1bb; margin: 4px 0 26px; }
  #caught-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 280px;
  }
  #caught-buttons button {
    color: #fff;
    border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    width: 100%;
  }
  #restart-here-btn  { background: #2a7f62; } /* 이어서 계속(탈출) - 잡힌 위치에서 점수/웨이브 유지하고 재시작 - 주 액션 */
  #restart-start-btn { background: #2a5f8f; } /* 현 지도에서 처음부터 다시 하기 - 이번 세션 시작 위치로, 점수/웨이브 초기화 */
  #restart-main-btn  { background: #4a4f58; } /* 메인 화면(권한 화면)으로 이동 */

  /* 게임 시작 시 "어느 나라/도시에서 출발했는지" 크게 보여주는 배너 */
  #location-banner {
    position: fixed;
    top: 26%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 630; /* 카운트다운(620)보다 위, 체포 오버레이(1000)보다는 아래 */
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.95);
  }
  #location-country {
    font-size: 36px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }
  #location-city {
    font-size: 19px;
    font-weight: 600;
    color: #ffd166;
  }

  /* 시작 시 자유 주행 카운트다운 */
  #countdown-overlay {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 620;
    display: none;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  #countdown-number {
    font-size: 44px;
    font-weight: 800;
    color: #fff;
    background: rgba(20,110,70,0.85);
    width: 74px;
    height: 74px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  #countdown-sub {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding: 4px 12px;
    border-radius: 999px;
  }

  /* ===== 위치 권한 오버레이 ===== */
  #permission-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #0d1117;
    color: #eaeaea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    box-sizing: border-box;
  }
  #permission-overlay h1 { font-size: 20px; margin-bottom: 10px; }
  #permission-overlay p { font-size: 14px; color: #a9b1bb; margin: 4px 0 26px; line-height: 1.5; }
  #start-btn {
    background: #2a7f62;
    color: #fff;
    border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  #start-domestic-random-btn {
    margin-top: 14px;
    background: #8a6d2c;
    color: #fff;
    border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  #start-domestic-random-btn:disabled,
  #start-capital-btn:disabled,
  #start-btn:disabled {
    opacity: 0.55;
  }
  #start-capital-btn {
    margin-top: 14px;
    background: #2c4d8a;
    color: #fff;
    border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  #permission-note {
    margin-top: 16px;
    font-size: 12px;
    color: #6b7280;
    min-height: 16px;
  }
</style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="지도 운전 게임">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
    window.addEventListener('beforeinstallprompt',e=>{
      e.preventDefault();
      window._pwaE=e;
      var b=document.createElement('div');
      b.style='position:fixed;bottom:0;left:0;right:0;background:#7c3aed;color:#fff;padding:18px;text-align:center;z-index:9999;font-size:15px;font-weight:bold;cursor:pointer;font-family:sans-serif;';
      b.innerHTML='📲 홈화면에 앱 추가하기 · Add to Home Screen';
      b.onclick=async function(){window._pwaE.prompt();var r=await window._pwaE.userChoice;if(r.outcome==='accepted')b.remove();};
      document.body.appendChild(b);
    });
  </script>
</head>
<body>

<div id="map"></div>

<!-- 화면 중앙 고정 자동차 (SVG, 위에서 내려다본 형태) -->
<div id="car">
  <svg viewBox="0 0 34 58">
    <path d="M17 1 C25 1 30 8 30 18 L30 46 C30 53 25 57 17 57 C9 57 4 53 4 46 L4 18 C4 8 9 1 17 1 Z"
          fill="#ff5a5f" stroke="#7a1216" stroke-width="1.5"/>
    <rect x="8" y="12" width="18" height="14" rx="3" fill="#1a2733" opacity="0.85"/>
    <rect x="8" y="34" width="18" height="12" rx="3" fill="#1a2733" opacity="0.6"/>
    <circle cx="17" cy="10" r="2.2" fill="#fff6c9"/>
  </svg>
</div>

<div id="wheel-zone">
  <div id="wheel-circle">
    <div id="wheel-center-dot"></div>
    <div id="wheel-needle"></div>
  </div>
</div>

<div id="controls">
  <button id="btn-forward" class="ctrl-btn">전진</button>
  <button id="btn-stop" class="ctrl-btn active-state">멈춤</button>
  <button id="btn-reverse" class="ctrl-btn">후진</button>
</div>

<div id="speed-controls">
  <button id="btn-speed-up" class="speed-btn">+</button>
  <button id="btn-speed-down" class="speed-btn">−</button>
</div>

<div id="hud-row">
  <div id="score-hud">점수: 0</div>
  <div id="hud">속도: 0 km/h</div>
</div>
<div id="wave-hud">1웨이브</div>
<button id="pause-btn" aria-label="일시정지">⏸</button>
<div id="offroad-warning">도로 이탈!</div>
<div id="catch-warning">경찰에게 붙잡히는 중...</div>
<div id="detected-warning">🚨 발각됨!</div>
<div id="police-layer"></div>

<div id="location-banner">
  <div id="location-country"></div>
  <div id="location-city"></div>
</div>

<div id="countdown-overlay">
  <div id="countdown-number">10</div>
  <div id="countdown-sub">자유 주행 시간! 이후 경찰 출동</div>
</div>

<div id="caught-overlay">
  <h1>체포되었습니다!</h1>
  <p>경찰차의 포위망 안에 5초를 초과해서 머물러 붙잡혔습니다.</p>
  <div id="caught-buttons">
    <button id="restart-here-btn">이어서 계속 (탈출)</button>
    <button id="restart-start-btn">현 지도에서 처음부터 다시 하기</button>

  <button id="start-capital-btn">해외 나라 수도에서 출발하기</button>

<script>
/* =========================================================
   지도 운전 게임 - 메인 스크립트
   - OpenFreeMap(무료, 키 불필요) 벡터 타일 + MapLibre GL JS 사용
   - 자동차는 항상 화면 정중앙에 고정, 실제로 움직이는 건 "지도"
   - 지도의 방위(bearing)는 항상 북쪽 고정, 자동차 아이콘 자체가 회전함
   ========================================================= */

// ---------- 1. 자동차 물리 상태 ----------
const car = {
  lat: 37.5665,      // 초기값(위치 권한 실패 시 서울시청으로 대체)
  lng: 126.9780,
  heading: 0,        // 0 = 북쪽, 시계방향 각도(도)
  speed: 0,          // m/s (양수: 전진, 음수: 후진)
  maxForwardSpeed: 80 / 3.6,   // 최고 전진 속도(m/s) - 기본 80km/h로 시작
  maxReverseSpeed: 4.5, // 최고 후진 속도(m/s)
  accel: 8,             // 가속도(m/s^2) - 경찰 추격전에서 너무 굼뜨지 않도록 기존(5)보다 상향
  brakeDecel: 9,        // 멈춤 버튼일 때 감속도
  knockbackTimer: 0,     // 남은 넉백 시간(초) - 0보다 크면 충돌로 튕겨나가는 중이라 조향/가속 입력이 무시됨
  knockbackHeading: 0,   // 넉백 중 강제로 이동하는 방향(도)
  knockbackSpeed: 0,     // 넉백 시작 속도(m/s) - 시간이 지날수록 0으로 감쇠
  knockbackDuration: 0.45, // 이번 넉백의 총 지속시간(초) - 충돌 종류(경찰차/트럭)마다 다르므로, 이즈아웃 계산에 이 값을 써야 정확함
  knockbackEndSpeed: 0,  // 넉백이 끝나는 순간의 속도(m/s) - 보통 0(완전 정지)이지만, 트럭 충돌처럼 "일정 속도만큼만 깎는" 피해는 0이 아닌 값을 넣는다
  collisionAccelBoostTimer: 0, // 경찰차와 충돌한 직후 남은 시간(초) - 이 동안은 평소보다 훨씬 빠른 가속도로 재가속한다
};

let throttleMode = 'forward'; // 'forward' | 'stop' | 'reverse' - 시작하자마자 자동으로 전진

// 화면에 그릴 때 쓰는 "연속된" 각도값. car.heading은 0~360으로 랩되지만,
// 화면 회전 애니메이션은 0/360 경계에서 튀지 않도록 이 값으로 따로 관리한다.
let visualHeading = 0;

// ---------- 2. 지도 초기화 ----------
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty', // 무료 오픈프리맵 스타일
  center: [car.lng, car.lat],
  zoom: 16,
  pitch: 0,           // 3D 기울임 없이 완전한 위에서 내려다보는 2D 시점
  bearing: 0,         // 항상 북쪽 고정
  interactive: false, // 사용자가 손가락으로 지도를 직접 움직이지 못하게 함(운전으로만 이동)
  attributionControl: { compact: true }
});

// 위성사진 위에 실제 도로선만 겹쳐 보이는 화면을 만든다:
// 1) Esri 위성 래스터 타일을 가장 아래에 깔고
// 2) 기존 벡터 스타일의 배경/땅/건물 같은 "면(fill)" 레이어들은 위성사진을 가려버리므로 전부 숨기고
// 3) 도로 강조선(drivable-road-highlight)만 위성사진 위에 그대로 남긴다 (지명/도로명 라벨도 유지)
map.on('load', () => {
  const style = map.getStyle();
  // 스타일 안에서 vector 타입 소스를 자동으로 찾는다 (OpenFreeMap 내부 소스 이름 대비)
  let vectorSourceId = null;
  for (const key in style.sources) {
    if (style.sources[key].type === 'vector') { vectorSourceId = key; break; }
  }

  // ---- 1) 무료 위성 타일(Esri World Imagery, API 키 불필요) 추가 ----
  map.addSource('esri-satellite', {
    type: 'raster',
    tiles: [
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
    ],
    tileSize: 256,
    attribution: 'Esri, Maxar, Earthstar Geographics'
  });
  const bottomLayerId = style.layers.length ? style.layers[0].id : undefined;
  map.addLayer({
    id: 'esri-satellite-layer',
    type: 'raster',
    source: 'esri-satellite',
    paint: { 'raster-opacity': 1 }
  }, bottomLayerId); // 스타일의 가장 아래(첫 레이어) 자리에 삽입 = 배경처럼 깔림

  // ---- 2) 위성사진을 가리는 배경/땅/건물 등 "면" 레이어는 숨김 (라벨은 남겨서 지명 파악 가능하게 함) ----
  style.layers.forEach((layer) => {
    if (layer.type === 'background' || layer.type === 'fill' || layer.type === 'fill-extrusion' || layer.type === 'line') {
      map.setLayoutProperty(layer.id, 'visibility', 'none');
    }
  });

  // ---- 3) 실제 도로 벡터 선을, 위성사진 위에서도 눈에 잘 띄는 색으로 강조해서 그린다 ----
  //    (단, "운전 가능한 도로"만 필터링해서 표시: 인도/자전거길/계단/철도/트램/페리 등은 제외)
  if (vectorSourceId) {
    map.addLayer({
      id: 'drivable-road-highlight',
      type: 'line',
      source: vectorSourceId,
      'source-layer': 'transportation', // OpenMapTiles 스키마의 도로 레이어명
      // OpenMapTiles의 'class' 속성 중, 자동차가 실제로 다닐 수 있는 도로 종류만 남긴다.
      // 제외되는 것들: path(오솔길), footway(인도), cycleway(자전거도로), steps(계단), pedestrian(보행자전용구역),
      //              bridleway(승마도로), track(비포장 농로), rail/tram/subway/light_rail/monorail/funicular(철도류),
      //              ferry(뱃길), aerialway(케이블카), raceway(경주트랙)
      filter: ['match', ['get', 'class'],
        ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'service'],
        true,
        false
      ],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': '#ffcc00',
        'line-opacity': 0.5,
        'line-width': [
          'interpolate', ['linear'], ['zoom'],
          14, 3,
          17, 12,
          20, 24
        ]
      }
    });
  }
});

// ---------- 3. 위치 권한 요청 및 시작 ----------
const overlay = document.getElementById('permission-overlay');
const noteEl = document.getElementById('permission-note');
const mapEl = document.getElementById('map');

// 화면 중앙에 국가명(크게) + 도시명(작게)을 3초간 보여주고 사라지는 배너.
// "지도와 자동차가 함께 화면에 나타나는 시점"에 호출해서 쓴다.
let locationBannerHideTimer = null;
function showLocationBanner(country, city) {
  const banner = document.getElementById('location-banner');
  document.getElementById('location-country').textContent = country || '';
  document.getElementById('location-city').textContent = city || '';
  banner.style.display = 'flex';
  banner.style.opacity = '1';
  if (locationBannerHideTimer) clearTimeout(locationBannerHideTimer);
  locationBannerHideTimer = setTimeout(() => {
    banner.style.display = 'none';
  }, 3000); // 요청대로 3초간 노출 후 사라짐
}

// ---------- 3-0. "국내에서 랜덤 출발" 기능 ----------
// 예전에는 대한민국 전체 경계 상자(bounding box) 안에서 완전히 무작위로 좌표를 뽑았는데,
// 그러다 보니 바다나 산 한복판이 뽑히는 경우가 많았다.
// 이제는 아래(KOREA_CITY_HALLS)에 정리해 둔 "실제 도청/시청 좌표" 중에서만 무작위로 고르므로,
// 항상 도심 한복판(도로가 확실히 있는 곳)에서 시작하게 된다.

// 지정한 좌표로 지도를 옮긴 뒤, 화면에 실제 "운전 가능한 도로"가 보이는지 확인한다.
// (map.once('idle')로 벡터 타일 로딩이 끝나길 기다린 다음 조회해야 정확하다)
//
// [수정 이유] 예전에는 줌 14로 화면 전체를 봐서 "화면 어딘가에 도로가 조금이라도 보이면" 통과 처리했다.
// 그런데 실제 게임 시작(beginGame)은 줌 16으로 훨씬 좁게 확대해서 그 지점 바로 위에 차를 스냅한다.
// 즉 줌14 화면 구석에 멀리 떨어진 해안도로가 살짝 걸쳐 보이는 것만으로 통과됐다가,
// 막상 줌16으로 확대하면 그 도로가 화면 밖으로 벗어나 스냅할 도로가 하나도 없어서
// 차가 바다/숲 한복판에 그대로 남는 문제가 있었다(스크린샷에서 보고된 현상).
// → 검사 시점의 줌을 beginGame과 동일한 16으로 맞추고, 화면 전체가 아니라
//   "후보 지점을 중심으로 한 좁은 박스"만 검사해서, 정말로 그 지점 근처에 도로가 있는 경우만 통과시킨다.
function hasRoadsNear(lat, lng) {
  const CHECK_ZOOM = 16; // beginGame()에서 실제로 사용하는 최종 줌과 동일하게 맞춤
  return new Promise((resolve) => {
    map.once('idle', () => {
      let feats;
      try {
        // 화면 정중앙(=후보 좌표) 주변 절반 크기의 박스만 검사.
        // 화면 전체가 아니라 중앙 위주로 좁혀서, "화면 구석에만 도로가 있는" 케이스를 걸러낸다.
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const halfW = window.innerWidth * 0.35;
        const halfH = window.innerHeight * 0.35;
        feats = map.queryRenderedFeatures(
          [[cx - halfW, cy - halfH], [cx + halfW, cy + halfH]],
          { layers: ['drivable-road-highlight'] }
        );
      } catch (e) { feats = null; }
      resolve(!!(feats && feats.length > 0));
    });
    map.jumpTo({ center: [lng, lat], zoom: CHECK_ZOOM, bearing: 0, pitch: 0 });
  });
}

  //  혹시 좌표 오차로 도로 인식이 안 되는 경우를 대비해 다음 후보로 재시도한다.)
  const shuffled = [...KOREA_CITY_HALLS].sort(() => Math.random() - 0.5);
  let chosen = null;
  let chosenName = '';
  const MAX_TRIES = 15;
  for (let i = 0; i < Math.min(MAX_TRIES, shuffled.length) && !chosen; i++) {
    const spot = shuffled[i];
    // 매번 정확히 같은 지점(청사 정문)에서 시작하지 않도록, 반경 약 300m 이내에서 살짝 흩어준다.
    const candLat = spot.lat + (Math.random() - 0.5) * 0.006;
    const candLng = spot.lng + (Math.random() - 0.5) * 0.006;
    const ok = await hasRoadsNear(candLat, candLng);
    if (ok) {
      chosen = { lat: candLat, lng: candLng };
      chosenName = spot.name;
    }
  }
  if (!chosen) {
    // 극히 드물게 15곳 모두 실패하면, 첫 후보의 좌표 그대로 사용(청사 정문은 항상 도로에 붙어 있음)

    chosen = { lat: spot.lat, lng: spot.lng };
    chosenName = spot.name;
  }

  car.lat = chosen.lat;
  car.lng = chosen.lng;
  noteEl.textContent = `${chosenName} 근처에서 출발합니다...`;

  document.getElementById('start-btn').disabled = false;
  document.getElementById('start-capital-btn').disabled = false;
  domesticRandomBtn.disabled = false;
  setTimeout(() => beginGame({ country: '대한민국', city: chosenName }), 700);
});

function beginGame(locationInfo) {
  overlay.style.display = 'none';
  // 낮은 줌에서 자세히 확대된 줌으로 서서히 이동하며 "지도가 점차 나타나는" 연출
  map.jumpTo({ center: [car.lng, car.lat], zoom: 14, bearing: 0, pitch: 0 });
  mapEl.classList.add('revealed');
  // 지도(위성사진)가 서서히 나타나기 시작하고, 화면 중앙의 자동차도 이 순간 함께 보이기 시작하므로,
  // "국내에서 랜덤 출발"/"해외 나라 수도에서 출발" 버튼으로 시작한 경우에는 바로 이 타이밍에 배너를 띄운다.
  if (locationInfo) showLocationBanner(locationInfo.country, locationInfo.city);
  map.flyTo({
    center: [car.lng, car.lat],
    zoom: 16,          // 요청에 따라 조정
    bearing: 0,
    pitch: 0,         // 3D 없이 완전한 탑다운 2D
    speed: 0.6,
    essential: true
  });
  // 중요: flyTo 확대 애니메이션이 "끝난 뒤"에 게임 루프를 시작해야 함.
  // 게임 루프가 매 프레임 jumpTo(중심좌표만)를 호출하는데, 이걸 애니메이션 도중에 실행하면
  // flyTo가 중간에 끊겨서 줌이 낮은 상태로 멈춰버리는 문제가 있었음(그래서 지도가 넓게 보였음).
  map.once('moveend', () => {
    // 실제 위치(또는 해외 수도처럼 방금 순간이동한 새 지역)가 도로 밖(건물 안 등)이어도 도로 위에서 시작하도록 보정.
    // 새 지역으로 막 이동한 직후에는 도로 벡터 타일이 아직 다 로딩되지 않아 스냅이 한 번에 실패할 수 있으므로,
    // "게임을 시작하는 이 순간"에 한해서만 짧은 간격으로 여러 번 재시도한다(재시작/체포 후 등 다른 시점에는 영향 없음).
    trySnapWithRetry(0);

    function trySnapWithRetry(attempt) {
      const snapped = snapCarToNearestRoad();
      const maxAttempts = 10; // 최대 10번, 200ms 간격 → 최대 약 2초까지 도로 타일 로딩을 기다림
      if (!snapped && attempt < maxAttempts) {
        setTimeout(() => trySnapWithRetry(attempt + 1), 200);
        return;
      }
      initialLat = car.lat;    // "처음 위치로 돌아가기" 버튼을 위해, 최초 시작 위치/방향을 기억해둔다
      initialLng = car.lng;
      initialHeading = car.heading;
      startPoliceCountdown(); // 자유 주행 카운트다운 시작 → 끝나면 경찰차 스폰
      requestAnimationFrame(gameLoop);
    }
  });
}

// 자동차의 시작 위치가 도로 위가 아니라면(집/건물 안에서 실행하는 경우 등),
// 현재 화면에 보이는 도로 중 가장 가까운 지점으로 위치를 옮기고, 그 도로 방향으로 머리를 맞춘다.
// 반환값: 스냅에 성공했으면 true, (아직 도로 타일이 안 그려졌거나 화면에 도로가 없어서) 실패했으면 false.
function snapCarToNearestRoad() {
  if (typeof turf === 'undefined') return false; // 라이브러리 로드 실패 시 원래 위치 그대로 시작

  let feats;
  try {
    // 화면 전체 범위에서 도로 강조 레이어를 조회 (시작 지점 근처에 국한하지 않고 넓게 탐색)
    feats = map.queryRenderedFeatures(
      [[0, 0], [window.innerWidth, window.innerHeight]],
      { layers: ['drivable-road-highlight'] }
    );
  } catch (e) { return false; }
  if (!feats || feats.length === 0) return false; // 화면 안에 도로 자체가 안 보이면(아직 타일 로딩 중일 수 있음) 스냅 실패

  const carPoint = turf.point([car.lng, car.lat]);
  let best = null;
  let bestDist = Infinity;
  for (const f of feats) {
    try {
      const snapped = turf.nearestPointOnLine(f, carPoint, { units: 'meters' });
      if (snapped.properties.dist < bestDist) {
        bestDist = snapped.properties.dist;
        best = { snapped, feature: f };
      }
    } catch (e) { /* 도형 형식이 안 맞으면 건너뜀 */ }
  }
  if (!best) return false;

  // 자동차 위치를 도로 위 가장 가까운 지점으로 이동
  const [snapLng, snapLat] = best.snapped.geometry.coordinates;
  car.lat = snapLat;
  car.lng = snapLng;

  // 스냅된 지점 주변 도로의 방향으로 자동차 머리를 맞춰줌 (LineString인 경우에만 계산)
  try {
    const coords = best.feature.geometry.coordinates;
    if (best.feature.geometry.type === 'LineString') {
      const idx = best.snapped.properties.index;
      const a = coords[idx];
      const b = coords[Math.min(idx + 1, coords.length - 1)];
      if (a && b) {
        const bearing = turf.bearing(turf.point(a), turf.point(b));
        car.heading = (bearing + 360) % 360;
        visualHeading = car.heading;
      }
    }
  } catch (e) { /* 방향 계산에 실패해도 위치 스냅은 그대로 유지 */ }

  map.jumpTo({ center: [car.lng, car.lat] });
  return true;
}

// 경찰차 한 대를 플레이어 주변의 지정된 방향(baseBearing) 근처, 무작위 거리에 스폰시키고
// (가능하면) 가장 가까운 도로 위로 스냅한 뒤, 화면에 표시할 DOM 요소도 함께 만들어 policeCars 배열에 추가한다.
// - 최초 스폰(spawnPoliceCars)과, 웨이브2에서 경찰차를 추가로 투입할 때 공통으로 사용한다.
function createPoliceCar(baseBearing) {
  const layer = document.getElementById('police-layer');
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);

  let lat = null, lng = null, bearingDeg = 0;
  for (let attempt = 0; attempt < 25; attempt++) {
    const tryBearing = baseBearing + (Math.random() * 60 - 30);
    const tryDist = POLICE_SPAWN_MIN_DIST_M + Math.random() * (POLICE_SPAWN_MAX_DIST_M - POLICE_SPAWN_MIN_DIST_M);
    const bearingRad = tryBearing * Math.PI / 180;
    const tryLat = car.lat + (tryDist * Math.cos(bearingRad)) / metersPerDegLat;
    const tryLng = car.lng + (tryDist * Math.sin(bearingRad)) / metersPerDegLng;

    const roadInfo = findRoadPointNear(tryLat, tryLng, 35); // 후보 지점에서 35m 이내에 실제 도로가 있어야 인정
    if (roadInfo) {
      lat = roadInfo.lat;
      lng = roadInfo.lng;
      bearingDeg = tryBearing;
      break;
    }
  }
  // 25번 시도해도 도로를 못 찾았다면(강/공터가 아주 넓은 경우), 최후의 수단으로
  // 플레이어가 서 있는 도로(항상 도로 위로 보정되어 있음) 바로 근처에 배치한다.
  if (lat === null) {
    const fallback = findRoadPointNear(car.lat, car.lng, 200) || { lat: car.lat, lng: car.lng };
    lat = fallback.lat;
    lng = fallback.lng;
    bearingDeg = baseBearing;
  }

  const el = document.createElement('div');
  el.className = 'police-car';
  el.innerHTML = `
    <svg viewBox="0 0 34 58">
      <path d="M17 1 C25 1 30 8 30 18 L30 46 C30 53 25 57 17 57 C9 57 4 53 4 46 L4 18 C4 8 9 1 17 1 Z"
            fill="#274b8f" stroke="#0f2452" stroke-width="1.5"/>
      <rect x="8" y="12" width="18" height="14" rx="3" fill="#1a2733" opacity="0.85"/>
      <rect x="8" y="34" width="18" height="12" rx="3" fill="#1a2733" opacity="0.6"/>
      <rect class="police-light" x="10" y="24" width="14" height="5" rx="1.5" fill="#ff3b3b"/>
    </svg>`;
  layer.appendChild(el);

  const circleEl = document.createElement('div');
  circleEl.className = 'catch-circle mode-chase'; // 발각 시스템을 없앴으므로, 스폰되자마자 바로 "추격" 상태(빨간 원)로 시작

  layer.appendChild(circleEl);

  policeCars.push({
    lat, lng, heading: bearingDeg, speed: 0, el, circleEl, farTimer: 0,
    lastGoodLat: lat, lastGoodLng: lng, // 마지막으로 확인된 "도로 위" 좌표 (건물/강 등으로 새는 것을 막는 기준점)
    state: 'chase',                     // 발각 시스템 제거: 스폰과 동시에 항상 'chase'(추격) 상태로 시작한다
    wanderHeading: bearingDeg,           // 순찰 중 목표로 삼는 방향
    wanderTimer: POLICE_WANDER_MIN_INTERVAL_SEC + Math.random() * (POLICE_WANDER_MAX_INTERVAL_SEC - POLICE_WANDER_MIN_INTERVAL_SEC),
    route: null,          // 추격 중 도로를 따라가는 경로(웨이포인트 배열) - 없으면 직선 추격으로 대체
    routeIndex: 0,        // 지금 향하고 있는 경로상의 웨이포인트 인덱스
    routeRecalcTimer: 0,  // 경로를 다시 계산하기까지 남은 시간(초)
    wasCollidingWithPlayer: false, // 직전 프레임에 플레이어와 물리적으로 맞닿아 있었는지(충돌 "순간"만 감지하기 위함)
    collisionCooldownTimer: 0,     // 한 번 충돌한 뒤, 다시 충돌 판정이 가능해지기까지 남은 시간(초)
    stunTimer: 0,                  // 충돌 직후 체포 판정(빨간 원)이 잠시 사라져 있는 남은 시간(초)
    knockbackTimer: 0,             // 남은 넉백 시간(초) - 0보다 크면 충돌로 튕겨나가는 중이라 추격 로직이 전부 멈춤
    knockbackHeading: 0,           // 넉백 중 강제로 이동하는 방향(도)
    knockbackSpeed: 0,             // 넉백 시작 속도(m/s) - 시간이 지날수록 0으로 감쇠
  });
}

// 경찰차 대수만큼, 플레이어 주변의 무작위 방향/거리에 스폰시킨다.
function spawnPoliceCars() {
  for (let i = 0; i < POLICE_COUNT; i++) {
    createPoliceCar((360 / POLICE_COUNT) * i);
  }
}

// 게임 시작 직후 지정된 시간(초) 동안 화면에 큰 숫자로 카운트다운을 보여주고,
// 그 시간 동안은 경찰차를 스폰하지 않아 플레이어가 자유롭게 돌아다닐 수 있게 한다.
// 카운트다운이 끝나면 그제서야 spawnPoliceCars()를 호출해 경찰차들을 등장시킨다.
function startPoliceCountdown() {
  const overlay = document.getElementById('countdown-overlay');
  const numberEl = document.getElementById('countdown-number');
  let remaining = POLICE_SPAWN_DELAY_SECONDS;

  overlay.style.display = 'flex';
  numberEl.textContent = remaining;

  const intervalId = setInterval(() => {
    if (isPaused) return; // 일시정지 중에는 카운트다운도 함께 멈춘다
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(intervalId);
      overlay.style.display = 'none';
      spawnPoliceCars(); // 카운트다운 종료 → 경찰차가 어디선가 나타남
      // [버그 수정] 재시작으로 웨이브가 유지된 경우, 지워졌던 웨이브별 누적 효과(트럭/스파이크/헬기 등)를
      // 현재 웨이브에 맞게 함께 복원한다. (최초 게임 시작 시엔 currentWave가 1이라 아무 효과도 없음)
      respawnWaveEnemies(currentWave, performance.now());
    } else {
      numberEl.textContent = remaining;
    }
  }, 1000);
}

// ---------- 4-1. 전진 버튼 옆 +/- 버튼: 최고 전진 속도를 10km/h씩 조절 ----------
const btnSpeedUp = document.getElementById('btn-speed-up');
const btnSpeedDown = document.getElementById('btn-speed-down');
const SPEED_STEP_MS = 10 / 3.6;      // 10km/h를 m/s로 환산
const MIN_MAX_SPEED_MS = 10 / 3.6;   // 최고속도 하한: 10km/h
const MAX_MAX_SPEED_MS = 190 / 3.6;  // 최고속도 상한: 190km/h

function adjustMaxSpeed(deltaMs) {
  car.maxForwardSpeed = Math.max(
    MIN_MAX_SPEED_MS,
    Math.min(MAX_MAX_SPEED_MS, car.maxForwardSpeed + deltaMs)
  );
  // 현재 속도가 새 최고속도보다 높다면 즉시 새 상한으로 맞춰줌
  if (car.speed > car.maxForwardSpeed) car.speed = car.maxForwardSpeed;
}
btnSpeedUp.addEventListener('pointerdown', () => adjustMaxSpeed(SPEED_STEP_MS));
btnSpeedDown.addEventListener('pointerdown', () => adjustMaxSpeed(-SPEED_STEP_MS));

// 버튼을 누르고 있는 동안 자동으로 반복 실행되도록 하는 공용 롱프레스 헬퍼
// (처음 한 번 즉시 실행 → REPEAT_DELAY_MS 뒤부터 → REPEAT_INTERVAL_MS 간격으로 계속 반복)
function attachHoldRepeat(el, action) {
  const REPEAT_DELAY_MS = 350;    // 누른 뒤 반복이 시작되기까지의 지연시간
  const REPEAT_INTERVAL_MS = 100; // 반복 간격
  let delayTimer = null;
  let repeatTimer = null;

  function stop() {
    clearTimeout(delayTimer);
    clearInterval(repeatTimer);
    delayTimer = null;
    repeatTimer = null;
  }

  el.addEventListener('pointerdown', () => {
    stop();
    action(); // 탭 한 번만 해도 즉시 1회 반영
    delayTimer = setTimeout(() => {
      repeatTimer = setInterval(action, REPEAT_INTERVAL_MS);
    }, REPEAT_DELAY_MS);
  });

  ['pointerup', 'pointerleave', 'pointercancel'].forEach((evt) => {
    el.addEventListener(evt, stop);
  });
}
attachHoldRepeat(btnSpeedUp, () => adjustMaxSpeed(SPEED_STEP_MS));
attachHoldRepeat(btnSpeedDown, () => adjustMaxSpeed(-SPEED_STEP_MS));

// ---------- 5. 우측 하단 원형 핸들: 중심 기준 각도를 그대로 자동차 방향에 매핑 ----------
const wheelZone = document.getElementById('wheel-zone');
const wheelNeedle = document.getElementById('wheel-needle');
let wheelActive = false;
const WHEEL_DEADZONE_PX = 10; // 중심에서 너무 가까우면 각도가 불안정하므로 무시

function updateHeadingFromPointer(e) {
  const rect = wheelZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist < WHEEL_DEADZONE_PX) return;
  // 중심점 기준 각도: 0=위쪽(북쪽/정면), 시계방향으로 증가 (자동차 heading 정의와 동일)
  const angle = Math.atan2(dx, -dy) * 180 / Math.PI;
  car.heading = (angle + 360) % 360;
}

wheelZone.addEventListener('pointerdown', (e) => {
  wheelActive = true;
  wheelZone.setPointerCapture(e.pointerId);
  updateHeadingFromPointer(e);
});
wheelZone.addEventListener('pointermove', (e) => {
  if (!wheelActive) return;
  updateHeadingFromPointer(e);
});
function releaseWheel() { wheelActive = false; }
wheelZone.addEventListener('pointerup', releaseWheel);
wheelZone.addEventListener('pointercancel', releaseWheel);
