  let screenPt;
  try {
    screenPt = map.project([lng, lat]);
  } catch (e) {
    return null;
  }
  const searchBox = [
    [screenPt.x - boxHalfPx, screenPt.y - boxHalfPx],
    [screenPt.x + boxHalfPx, screenPt.y + boxHalfPx]
  ];
  let feats;
  try {
    feats = map.queryRenderedFeatures(searchBox, { layers: ['drivable-road-highlight'] });
  } catch (e) {
    return null;
  }
  if (!feats || feats.length === 0) return null; // 주변에 도로 정보 자체가 없으면 판단 보류

  const turfPoint = turf.point([lng, lat]);
  let best = null;
  let bestDist = Infinity;
  for (const f of feats) {
    try {
      const snapped = turf.nearestPointOnLine(f, turfPoint, { units: 'meters' });
      if (snapped.properties.dist < bestDist) {
        bestDist = snapped.properties.dist;
        best = snapped.geometry.coordinates; // [lng, lat]
      }
    } catch (e) { /* 도형 형식이 안 맞으면 건너뜀 */ }
  }
  if (!best) return null;
  return { dist: bestDist, lng: best[0], lat: best[1] };
}

// getNearestRoadInfo를 여러 검색 반경(픽셀)으로 순차 재시도하면서,
// 실제로 "maxAcceptDistM" 이내에 있는 진짜 도로 지점을 찾는다.
// (화면 좁은 박스 안에 도로 렌더링 자체가 없어서 null이 나오는 경우를 보완)
function findRoadPointNear(lat, lng, maxAcceptDistM = 40) {
  for (const boxHalfPx of [90, 180, 320]) {
    const info = getNearestRoadInfo(lat, lng, boxHalfPx);
    if (info && info.dist <= maxAcceptDistM) return info;
  }
  return null;
}

// ============================================================
//  경찰차 길찾기: 화면에 렌더링된 도로선을 그래프로 만들고 최단경로를 구한다
// ============================================================

// 현재 화면(뷰포트)에 그려진 모든 도로 벡터선을 모아 "노드(교차점/꼭짓점) + 간선(도로 구간)" 그래프로 만든다.
// - 서로 다른 벡터 타일 경계에서 좌표가 미세하게 어긋나는 경우를 대비해, 작은 격자(SNAP)로 좌표를 반올림해
//   충분히 가까운 점들을 같은 노드로 합친다.
// - 도로 데이터가 아예 없으면(로딩 전 등) null을 반환한다.
function buildRoadGraph() {
  let feats;
  try {
    feats = map.queryRenderedFeatures({ layers: ['drivable-road-highlight'] });
  } catch (e) {
    return null;
  }
  if (!feats || feats.length === 0) return null;

  const nodeCoord = new Map(); // key -> [lng, lat] (해당 격자의 대표 좌표)
  const adj = new Map();       // key -> [{ to: key, dist: meters }, ...]

  function keyOf(lng, lat) {
    return Math.round(lat / ROAD_GRAPH_NODE_SNAP_DEG) + '_' + Math.round(lng / ROAD_GRAPH_NODE_SNAP_DEG);
  }
  function ensureNode(lng, lat) {
    const k = keyOf(lng, lat);
    if (!nodeCoord.has(k)) {
      nodeCoord.set(k, [lng, lat]);
      adj.set(k, []);
    }
    return k;
  }
  function addEdge(k1, k2, dist) {
    if (k1 === k2 || dist <= 0) return;
    adj.get(k1).push({ to: k2, dist });
    adj.get(k2).push({ to: k1, dist });
  }

  for (const f of feats) {
    const geom = f.geometry;
    if (!geom) continue;
    const lines = geom.type === 'LineString' ? [geom.coordinates]
                : geom.type === 'MultiLineString' ? geom.coordinates
                : null;
    if (!lines) continue;

    for (const coords of lines) {
      let prevKey = null, prevCoord = null;
      for (const c of coords) {
        const k = ensureNode(c[0], c[1]);
        if (prevKey !== null) {
          const dist = turf.distance(turf.point(prevCoord), turf.point(c), { units: 'meters' });
          addEdge(prevKey, k, dist);
        }
        prevKey = k;
        prevCoord = c;
      }
    }
    if (nodeCoord.size > ROAD_GRAPH_MAX_NODES) return null; // 너무 커지면 성능 보호를 위해 포기(호출 쪽에서 직선 추격으로 대체)
  }

  if (nodeCoord.size === 0) return null;
  return { nodeCoord, adj };
}

// 그래프에서 주어진 위경도와 가장 가까운 노드를 찾는다(경로의 시작/끝 지점을 그래프에 "붙이기" 위함).
// maxDistM을 지정하면, 가장 가까운 노드조차 그보다 멀리 떨어져 있을 경우 null을 반환한다.
// → buildRoadGraph()가 "현재 화면에 렌더링된 도로"만 대상으로 하기 때문에, 화면 밖 먼 곳(예: 방금
//   스폰된 경찰차)의 실제 위치 근처에는 그래프에 도로 데이터가 아예 없을 수 있다. 이때 그냥 화면 안의
//   아무 노드나 "가장 가까운 노드"로 잘못 잡으면, 실제로는 연결되지도 않은 엉뚱한 경로를 따라가며
//   방향을 못 잡고 겉도는(순찰하듯 서투르게 도는) 문제가 생긴다.
function nearestGraphNode(graph, lng, lat, maxDistM) {
  let bestKey = null, bestDist = Infinity;
  const target = turf.point([lng, lat]);
  for (const [k, coord] of graph.nodeCoord) {
    const d = turf.distance(turf.point(coord), target, { units: 'meters' });
    if (d < bestDist) { bestDist = d; bestKey = k; }
  }
  if (bestKey === null) return null;
  if (maxDistM !== undefined && bestDist > maxDistM) return null; // 이 근처엔 그래프에 잡힌 도로 데이터가 없다는 뜻 → 호출 쪽에서 직선 추격으로 대체
  return { key: bestKey, dist: bestDist };
}

// 다익스트라 최단경로: startLng/Lat에서 endLng/Lat까지, 그래프(도로망)를 따라가는 웨이포인트 배열을 반환한다.
// - 노드 수가 많지 않다는 전제(게임 화면 하나 분량의 도로만 대상) 하에, 우선순위 큐 없이 단순 선형 탐색으로 구현.
// - 경로를 못 찾으면(그래프가 끊어져 있는 등) null을 반환 → 호출 쪽에서 기존 직선 추격으로 대체(안전장치).
// - startMaxSnapM: 시작 지점(주로 경찰차의 실제 위치)이 그래프 상 가장 가까운 노드로부터 이보다 멀면
//   "이 근처엔 도로 데이터가 없다"고 보고 바로 null을 반환한다(먼 곳에 스폰된 차가 화면 안의 엉뚱한
//   노드로 잘못 스냅되어 이상한 경로를 따라가는 것을 막기 위함).
function findRoutePath(graph, startLng, startLat, endLng, endLat, startMaxSnapM) {
  const startNode = nearestGraphNode(graph, startLng, startLat, startMaxSnapM);
  const endNode = nearestGraphNode(graph, endLng, endLat);
  if (!startNode || !endNode) return null;

  const dist = new Map([[startNode.key, 0]]);
  const prev = new Map();
  const visited = new Set();

  while (true) {
    let u = null, uDist = Infinity;
    for (const [k, d] of dist) {
      if (!visited.has(k) && d < uDist) { uDist = d; u = k; }
    }
    if (u === null || u === endNode.key) break;
    visited.add(u);

    for (const edge of (graph.adj.get(u) || [])) {
      if (visited.has(edge.to)) continue;
      const nd = uDist + edge.dist;
      if (nd < (dist.has(edge.to) ? dist.get(edge.to) : Infinity)) {
        dist.set(edge.to, nd);
        prev.set(edge.to, u);
      }
    }
  }

  if (!dist.has(endNode.key)) return null; // 도로망 상으로 도달할 수 없음(그래프가 끊어짐 등)

  const pathKeys = [endNode.key];
  let cur = endNode.key;
  while (cur !== startNode.key) {
    cur = prev.get(cur);
    if (cur === undefined) return null; // 역추적 실패(이론상 발생하지 않아야 하지만 안전장치)
    pathKeys.push(cur);
  }
  pathKeys.reverse();

  const waypoints = pathKeys.map((k) => graph.nodeCoord.get(k));
  // 마지막 노드에서 멈추지 말고, 실제 플레이어 좌표까지 한 걸음 더 접근하도록 목표점을 추가
  waypoints.push([endLng, endLat]);
  return waypoints;
}

// 실제 반경(미터)이 지금 화면에서 몇 픽셀에 해당하는지, "근사 공식"이 아니라
// 아이콘을 그릴 때 쓰는 것과 동일한 map.project() 좌표 변환으로 정확히 구한다.
// (예전에는 "156543.03392*cos(lat)/2^zoom" 같은 고정 타일 크기 가정 공식을 썼는데,
//  지도 라이브러리가 실제로 쓰는 타일 크기 기준과 어긋나서 원이 실제보다 작게 그려지는
//  오차가 있었다 → 화면상 초록/빨간 원 밖에 있는데도 발각/체포되는 것처럼 보이는 원인이었음.
//  이 함수는 중심점과 그로부터 실제 반경만큼 떨어진 지점을 둘 다 화면에 투영해서 그 픽셀
//  거리를 재기 때문에, 지도가 어떻게 그려지든 항상 화면과 100% 일치한다.)
function metersToScreenPixels(lat, lng, meters) {
  const centerPt = map.project([lng, lat]);
  const edgePoint = turf.destination(turf.point([lng, lat]), meters / 1000, 0, { units: 'kilometers' });
  const edgePt = map.project(edgePoint.geometry.coordinates);
  return Math.hypot(centerPt.x - edgePt.x, centerPt.y - edgePt.y);
}

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000); // 초 단위, 급격한 프레임 드랍 방지
  lastTime = now;

  // 이미 체포된 상태이거나 일시정지 중이라면 모든 갱신을 멈추고 화면만 유지한다
  if (isCaught || isPaused) {
    requestAnimationFrame(gameLoop);
    return;
  }

  // 점수 계산용: 이번 프레임이 시작될 때의 위치를 기억해 둔다(프레임 끝의 실제 위치와 비교해 이동 거리를 구함)
  const scoreStartLat = car.lat;
  const scoreStartLng = car.lng;

  // 넉백(충돌로 튕겨나가는 중)인지 여부. 넉백 중에는 스로틀/조향/도로이탈 로직을 전부 무시하고,
  // 정해진 대각선 방향으로 강제로 밀려나며 속도가 점점 0으로 줄어든다. 넉백이 끝나는 순간 speed=0이
  // 되므로, 그 다음 프레임부터는 평소 로직에 따라 다시 처음부터 가속해서 출발하게 된다.
  const inKnockback = car.knockbackTimer > 0;

  // --- 속도 갱신 ---
  if (inKnockback) {
    car.knockbackTimer = Math.max(0, car.knockbackTimer - dt);
    const kt = car.knockbackTimer / car.knockbackDuration; // 1 → 0으로 이즈아웃 (충돌 종류별 실제 지속시간 기준)
    // 보통은 knockbackEndSpeed가 0이라 완전 정지까지 이즈아웃되지만, 트럭 충돌처럼 "속도를 일정량만 깎는"
    // 피해의 경우 knockbackEndSpeed가 0이 아니므로 그 속도까지만 이즈아웃된다.
    car.speed = car.knockbackEndSpeed + (car.knockbackSpeed - car.knockbackEndSpeed) * kt;
    car.heading = car.knockbackHeading;
    if (car.knockbackTimer <= 0) {
      car.speed = car.knockbackEndSpeed; // 넉백 종료 → 지정된 속도(보통 0)로 정착한 뒤 다시 출발
      setThrottle('forward'); // 유저가 다시 누르지 않아도 자동으로 전진 버튼이 눌린 상태로 전환
    }
  } else if (offroadPenaltyState === 'dropping') {
    // 이탈 직후: 목표 속도(-10km/h)까지 짧은 시간 동안 빠르게 감속 (눈금계가 훅 줄어드는 연출)
    offroadPenaltyTimer += dt;
    const t = Math.min(1, offroadPenaltyTimer / OFFROAD_PENALTY_DROP_DURATION);
    car.speed = offroadPenaltyStartSpeed + (offroadPenaltyTargetSpeed - offroadPenaltyStartSpeed) * t;
    if (t >= 1) {
      car.speed = offroadPenaltyTargetSpeed;
      offroadPenaltyState = 'none'; // 대기 없이 곧바로 평소 가속 로직으로 복귀
      offroadPenaltyTimer = 0;
    }
  } else {
    // 패널티가 없는 평소 상태: 기존과 동일한 스로틀 기반 가속/감속
    const target = throttleMode === 'forward' ? car.maxForwardSpeed
                 : throttleMode === 'reverse' ? -car.maxReverseSpeed
                 : 0;
    const decel = throttleMode === 'stop' ? car.brakeDecel : car.accel;

    // 경찰차 충돌 직후 남은 부스트 시간이 있다면, 그 동안만 훨씬 큰 가속도로 재가속한다.
    if (car.collisionAccelBoostTimer > 0) {
      car.collisionAccelBoostTimer = Math.max(0, car.collisionAccelBoostTimer - dt);
    }
    const accelToUse = car.collisionAccelBoostTimer > 0 ? PLAYER_POST_COLLISION_ACCEL : car.accel;

    if (car.speed < target) {
      car.speed = Math.min(target, car.speed + accelToUse * dt);
    } else if (car.speed > target) {
      car.speed = Math.max(target, car.speed - decel * dt);
    }
  }


  // --- 방향(heading)은 이제 오른쪽 조향 영역의 pointermove 이벤트에서 직접 갱신됨 ---
  // (손가락 이동량 = 자동차 머리 회전각, 1:1 직접 매핑 방식이라 여기서 별도 계산 불필요)

  // --- 위치(위경도) 후보값 계산 (아직 확정하지 않음) ---
  const headingRad = car.heading * Math.PI / 180;
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);
  const dNorth = car.speed * dt * Math.cos(headingRad);
  const dEast  = car.speed * dt * Math.sin(headingRad);
  const candidateLat = car.lat + dNorth / metersPerDegLat;
  const candidateLng = car.lng + dEast / metersPerDegLng;

  // --- 도로 위인지 확인하고, 이동을 확정한다 ---
  // 도로 위: 그대로 이동. 살짝 이탈: 이탈 "순간"에 -10km/h 급감속 패널티를 한 번 트리거하고
  // 도로 쪽으로 방향을 틀며 계속 진행(자동 복귀). 많이 이탈(OFFROAD_HARD_BLOCK_METERS 초과):
  // 방향만 도로 쪽으로 틀 뿐, 그 방향으로는 "전진 자체"가 막혀서 강이나 건물 단지를 뚫고 갈 수 없다.
  if (Math.abs(car.speed) > 0.001) {
    const roadInfo = findRoadPointNear(candidateLat, candidateLng, OFFROAD_DETECT_RANGE_METERS);
    const onRoad = !roadInfo || roadInfo.dist <= ROAD_HALF_WIDTH_METERS;
    const hardBlocked = roadInfo && roadInfo.dist > OFFROAD_HARD_BLOCK_METERS;

    if (onRoad) {
      car.lat = candidateLat;
      car.lng = candidateLng;
      offroadWarning.style.display = 'none';
      wasOffRoad = false; // 다시 도로 위로 복귀 → 다음 이탈 때 패널티가 새로 트리거되도록 초기화
    } else {
      offroadWarning.style.display = 'block';
      offroadWarning.textContent = hardBlocked ? '도로 이탈! (진행 불가)' : '도로 이탈!';
      offroadWarningHideAt = now + 900;

      // 방금 막 이탈한 "순간"이라면(직전 프레임까진 도로 위였다면) 급감속 패널티를 새로 트리거
      // (단, 넉백 중에는 이미 강제로 속도를 제어하고 있으므로 별도의 도로이탈 패널티는 겹쳐 걸지 않는다)
      if (!wasOffRoad && offroadPenaltyState === 'none' && !inKnockback) {
        offroadPenaltyState = 'dropping';
        offroadPenaltyTimer = 0;
        offroadPenaltyStartSpeed = car.speed;
        if (car.speed > 0) {
          offroadPenaltyTargetSpeed = Math.max(0, car.speed - OFFROAD_PENALTY_DROP_MS);
        } else if (car.speed < 0) {
          offroadPenaltyTargetSpeed = Math.min(0, car.speed + OFFROAD_PENALTY_DROP_MS);
        } else {
          offroadPenaltyTargetSpeed = 0;
        }
      }
      wasOffRoad = true;

      // 1) 가장 가까운 도로 지점을 향한 방향(베어링) 계산
      const toRoadBearing = turf.bearing(
        turf.point([candidateLng, candidateLat]),
        turf.point([roadInfo.lng, roadInfo.lat])
      );

      // 2) 현재 heading을 그 방향으로 "제한된 속도"로 부드럽게 회전 (한 프레임에 확 꺾이지 않게)
      let hdiff = toRoadBearing - car.heading;
      hdiff = ((hdiff + 540) % 360) - 180; // -180~180 사이 최단 회전량으로 정규화
      const maxTurn = OFFROAD_STEER_RATE_DEG_PER_SEC * dt;
      car.heading = (car.heading + Math.max(-maxTurn, Math.min(maxTurn, hdiff)) + 360) % 360;

      if (hardBlocked) {
        // 하드 블록: 방향만 바뀔 뿐, 도로에서 이만큼 멀어지는 이동은 아예 적용하지 않는다.
        // (다음 프레임에 heading이 도로 쪽으로 더 돌아가면, 그때는 dist가 줄어들어 다시 전진이 허용됨)
      } else {
        // 3) 위 속도 갱신 단계(dropping/holding/정상)에서 이미 결정된 car.speed를 그대로 사용해
        //    보정된 heading/speed로 이번 프레임 위치를 다시 계산, 실제로 도로 쪽으로 밀어 넣는다
        const hRad2 = car.heading * Math.PI / 180;
        const dN2 = car.speed * dt * Math.cos(hRad2);
        const dE2 = car.speed * dt * Math.sin(hRad2);
        car.lat += dN2 / metersPerDegLat;
        car.lng += dE2 / metersPerDegLng;
      }
    }
  }
  if (offroadWarningHideAt && now > offroadWarningHideAt) {
    offroadWarning.style.display = 'none';
    offroadWarningHideAt = 0;
  }
  if (detectedWarningHideAt && now > detectedWarningHideAt) {
    document.getElementById('detected-warning').style.display = 'none';
    detectedWarningHideAt = 0;
  }

  // --- 지도는 항상 자동차 위치를 중심으로, 북쪽 고정(bearing 0) ---
  map.jumpTo({ center: [car.lng, car.lat] });

  // --- 자동차 아이콘 자체를 heading만큼 회전 ---
  // --- 0/360도 경계에서 회전이 튀지 않도록, 화면 표시용 각도를 "최단 방향"으로 연속 갱신 ---
  let diff = car.heading - visualHeading;
  diff = ((diff + 180) % 360 + 360) % 360 - 180; // 항상 -180~180 사이의 최단 회전량으로 정규화
  visualHeading += diff;

  document.getElementById('car').style.transform = `rotate(${visualHeading}deg)`;
  // 원형 핸들 안의 바늘도 자동차와 항상 같은 방향을 가리키게 동기화
  wheelNeedle.style.transform = `translateY(-100%) rotate(${visualHeading}deg)`;

  // --- HUD 속도 표시 (m/s -> km/h), 현재 설정된 최고 전진속도도 함께 표시 ---
  hud.textContent = `속도: ${Math.round(Math.abs(car.speed) * 3.6)} / 최고 ${Math.round(car.maxForwardSpeed * 3.6)} km/h`;

  // --- 점수 갱신: 프레임 시작 위치 대비 "실제로" 이동한 거리만큼만 점수를 더한다 ---
  // (경찰을 피해 멈춰 서 있거나, 도로 밖으로 막혀서 못 나가거나, 그냥 정차 중이면 이동 거리가 0이라
  //  자동으로 점수가 오르지 않는다 - 별도의 "정차 감지" 로직이 필요 없다)
  const movedMeters = turf.distance(
    turf.point([scoreStartLng, scoreStartLat]), turf.point([car.lng, car.lat]), { units: 'meters' }
  );
  score += movedMeters / SCORE_METERS_PER_POINT;
  scoreHud.textContent = `점수: ${Math.floor(score)}`;

  // --- 웨이브 갱신: 점수가 WAVE_SCORE_STEP(200점)을 넘을 때마다 웨이브를 1씩 올리고, 새 웨이브의 효과를 적용 ---
  const targetWave = 1 + Math.floor(score / WAVE_SCORE_STEP);
  while (currentWave < targetWave) {
    currentWave += 1;
    applyWaveUpgrade(currentWave, now);
  }

  // --- 경찰차 추격/체포 판정 갱신 ---
  updatePoliceCars(dt, now);

  // --- 웨이브4 특수 트럭들 갱신(충돌/체포/화면 밖 이탈/재등장 판정 포함) ---
  // (트럭이 잠시 0대인 순간에도 재등장 타이머는 계속 흘러야 하므로, 배열 길이가 아니라 웨이브로 판단한다)
  if (currentWave >= 4) updateSpecialTrucks(dt, now);

  // --- 웨이브6+ 자유주행 "길막" 민간 차량 갱신(충돌 판정 포함) ---
  if (civilianBlocker) updateCivilianBlocker(dt, now);

  // --- 웨이브5 스파이크 스트립 갱신(밟았는지 판정 포함) ---
  if (spikeStrips.length > 0) updateSpikeStrips(dt);

  // --- 웨이브6 경찰 헬기 갱신(도로 무시하고 플레이어에게 직진 추격) ---
  if (policeHelicopter) updateHelicopter(dt, now);

  // --- 경찰차 + 헬기, 모든 추격 수단을 종합한 체포 판정 ---
  updateCatchStatus(dt);

  requestAnimationFrame(gameLoop);
}

// 웨이브가 새로 올라갈 때, 해당 웨이브의 난이도 상승 효과를 1회 적용한다.
// (웨이브는 누적 방식: 2웨이브 효과는 3/4웨이브에서도 계속 유지된다)
function applyWaveUpgrade(wave, now) {
  waveHud.textContent = `${wave}웨이브`;

  if (wave === 2) {
    // 경찰차 대수 +1
    createPoliceCar(Math.random() * 360);
  } else if (wave === 3) {
    // 경찰차 속도(순찰/추격 모두)를 더 빠르게
    policeWaveSpeedMultiplier = 1.25;
  } else if (wave === 4) {
    // 트럭형 특수 경찰차량 등장 (항상 2대)
    spawnSpecialTrucks();
  } else if (wave === 5) {
    // 도로 곳곳에 스파이크 스트립(타이어 파열 장치) 살포
    spawnSpikeStrips();
  } else if (wave === 6) {
    // 경찰 헬기 등장: 도로를 무시하고 곧장 플레이어를 향해 추격(단, 플레이어보다 빠르지는 않음)
    spawnHelicopter(now);
    // 자유롭게 돌아다니는 "길막" 민간 차량(녹색) 등장: 추격은 안 하지만 마주치면 부딪혀서 방해가 됨
    spawnCivilianBlocker();
  } else if (wave >= 7 && (wave - 7) % 2 === 0) {
    // 7웨이브에 경찰차 +1, 이후 9/11/13웨이브...처럼 2웨이브마다 계속 +1
    createPoliceCar(Math.random() * 360);
  }
}

// [버그 수정용] 경찰에게 잡힌 뒤 "이어서 계속" 등으로 재시작할 때,
// clearPoliceCars()가 지워버린 웨이브별 누적 효과(추가 경찰차/트럭/스파이크/헬기/민간차량)를
// 현재 웨이브에 맞게 다시 스폰해준다. (속도 배율처럼 상태값으로만 존재하는 효과는
// clearPoliceCars()로 사라지지 않으므로 여기서 다시 건드릴 필요가 없다)
function respawnWaveEnemies(wave, now) {
  // 웨이브2에서 추가된 경찰차 +1
  if (wave >= 2) createPoliceCar(Math.random() * 360);
  // 웨이브4: 트럭형 특수 경찰차량
  if (wave >= 4) spawnSpecialTrucks();
  // 웨이브5: 스파이크 스트립
  if (wave >= 5) spawnSpikeStrips();
  // 웨이브6: 헬기 + 민간 "길막" 차량
  if (wave >= 6) {
    spawnHelicopter(now);
    spawnCivilianBlocker();
  }
  // 웨이브7부터 2웨이브마다(7,9,11...) 추가된 경찰차 +1씩
  for (let w = 7; w <= wave; w += 2) {
    createPoliceCar(Math.random() * 360);
  }
}

// 경찰차들의 이동을 처리한다.
// - patrol(순찰): 플레이어 위치를 전혀 모른 채, 도로를 따라 무작위로 방향을 바꾸며 천천히 순찰한다.
//   주변에 큰 초록 원(탐지 범위)을 표시하고, 플레이어가 그 안에 들어오면 "발각"되어 chase로 전환된다.
// - chase(추격): 발각된 상태로, 플레이어를 향해 (플레이어보다 느리지만) 빠르게 추격한다.
//   작은 빨간 원(체포 판정 범위) 안에 5초를 초과해서 머물면 체포된다.
// 두 상태 모두 도로 위 유지(하드 블록 포함)는 동일하게 적용된다.
function updatePoliceCars(dt, now) {
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);
  const policeChaseSpeed = car.maxForwardSpeed * POLICE_SPEED_FACTOR * policeWaveSpeedMultiplier;   // 추격 중 최고 속도(플레이어보다 느림, 웨이브3+ 배율 적용)
  const policePatrolSpeed = car.maxForwardSpeed * POLICE_PATROL_SPEED_FACTOR * policeWaveSpeedMultiplier; // 순찰 중 속도(훨씬 느림, 웨이브3+ 배율 적용)
  const maxTurn = POLICE_STEER_RATE_DEG_PER_SEC * dt;

  let playerInsideAnyCircle = false;

  // 이번 프레임에 추격 중인 경찰차가 여럿이어도 도로 그래프는 한 번만 만들어서 재사용한다(성능 보호).
  let cachedRoadGraph;
  let roadGraphBuilt = false;
  function getRoadGraphCached() {
    if (!roadGraphBuilt) {
      cachedRoadGraph = buildRoadGraph();
      roadGraphBuilt = true;
    }
    return cachedRoadGraph;
  }

  policeCars.forEach((pc) => {
    // 0) 발각 여부는 이번 프레임의 '이동을 마친 뒤'(최종 위치) 거리로 판정해야
    //    화면에 그려지는 초록 원과 정확히 일치한다. (아래 3번에서 위치 이동을 마친 뒤 다시 계산해서 사용)
    //    → 이동 전 위치로 미리 판정해버리면, 경찰차가 순찰하며 다가오는 도중
    //      "원이 화면상 아직 플레이어에 닿지 않았는데도 발각되는" 오차가 생긴다.
    let pendingDetect = false;

    // 0-a) 넉백(충돌로 튕겨나가는 중) 처리: 이 동안은 추격/순찰/조향 로직을 전부 건너뛰고,
    //      정해진 대각선 방향으로 강제로 밀려나며 속도가 점점 0으로 줄어든다. 넉백이 끝나면
    //      speed=0인 상태에서 다음 프레임부터 평소 로직(추격/순찰)이 다시 자연스럽게 시작된다.
    if (pc.knockbackTimer > 0) {
      pc.knockbackTimer = Math.max(0, pc.knockbackTimer - dt);
      const kt = pc.knockbackTimer / KNOCKBACK_DURATION_SEC; // 1 → 0으로 이즈아웃
      pc.speed = pc.knockbackSpeed * kt;
      pc.heading = pc.knockbackHeading;
      if (pc.knockbackTimer <= 0) pc.speed = 0; // 넉백 종료 → 완전 정지 상태에서 다시 출발

      const kHeadingRad = pc.heading * Math.PI / 180;
      pc.lat += (pc.speed * dt * Math.cos(kHeadingRad)) / metersPerDegLat;
      pc.lng += (pc.speed * dt * Math.sin(kHeadingRad)) / metersPerDegLng;
      pc.lastGoodLat = pc.lat;
      pc.lastGoodLng = pc.lng;

      if (pc.stunTimer > 0) pc.stunTimer = Math.max(0, pc.stunTimer - dt);
      if (pc.collisionCooldownTimer > 0) pc.collisionCooldownTimer -= dt;
      pc.wasCollidingWithPlayer = false;

      // 아이콘/판정 원 위치는 정상적으로 갱신해서, 넉백 중에도 화면상 부드럽게 따라오게 한다.
      const screenPtKb = map.project([pc.lng, pc.lat]);
      pc.el.style.transform = `translate(${screenPtKb.x - 7}px, ${screenPtKb.y - 12}px) rotate(${pc.heading}deg)`;
      const radiusMetersKb = pc.state === 'chase' ? CATCH_RADIUS_METERS : POLICE_DETECTION_RADIUS_METERS;
      const diameterPxKb = 2 * metersToScreenPixels(pc.lat, pc.lng, radiusMetersKb);
      pc.circleEl.style.width = `${diameterPxKb}px`;
      pc.circleEl.style.height = `${diameterPxKb}px`;
      pc.circleEl.style.transform = `translate(${screenPtKb.x - diameterPxKb / 2}px, ${screenPtKb.y - diameterPxKb / 2}px)`;
      // [수정] 이미 체포 카운트가 진행 중이었다면(caughtTimer > 0), 넉백으로 서로 튕겨나가는 동안에도
      // "포위 중" 상태를 그대로 유지시켜 카운트가 끊기지 않고 계속 이어지게 한다.
      // (원래는 넉백 중엔 이 아래 return으로 판정 자체를 건너뛰어서, updateCatchStatus()의
      //  isSurrounded가 false가 되어 caughtTimer가 즉시 0으로 리셋돼버렸다 → 체포 직전에 일부러
      //  경찰차를 들이받아 카운트를 무효화하는 꼼수가 가능했던 원인. 이미 카운트가 시작된 뒤의
      //  충돌이라면 계속 이어서 세지도록, 여기서도 판정을 살려둔다.)
      if (pc.state === 'chase' && caughtTimer > 0) {
        playerInsideAnyCircle = true;
        catchSourcePos = { lat: pc.lat, lng: pc.lng, radiusMeters: CATCH_RADIUS_METERS, holdSeconds: CATCH_HOLD_SECONDS };
        // 카운트가 계속 이어지고 있음을 시각적으로도 보여주기 위해, 이 경우에는 판정 원을 숨기지 않는다.
        pc.circleEl.style.display = '';
      } else {
        pc.circleEl.style.display = 'none'; // 넉백 중에는 체포/탐지 판정 원을 숨겨서 "서로 튕겨나가 잠시 놓쳤다"는 느낌을 준다
      }
      return; // 넉백 중엔 추격/순찰/충돌판정 등 나머지 로직을 전부 건너뜀
    }

    // 1) 속도: 상태에 따라 다른 목표 속도를 향해 가속/감속
    const targetSpeed = pc.state === 'chase' ? policeChaseSpeed : policePatrolSpeed;
    if (pc.speed < targetSpeed) pc.speed = Math.min(targetSpeed, pc.speed + car.accel * dt);
    else if (pc.speed > targetSpeed) pc.speed = Math.max(targetSpeed, pc.speed - car.accel * dt);

    // 2) 조향: 추격 중이면 "도로를 따라가는 경로"의 다음 지점을 향해, 순찰 중이면 스스로 정한(무작위로 바뀌는) 순찰 방향을 향해 튼다
    let desiredBearing;
    if (pc.state === 'chase') {
      // 2-0) 플레이어와 이미 충분히 가까우면(도로 그래프가 촘촘한 주차장/골목 등에서
      //      매번 다른 노드로 경로가 재계산되며 제자리를 맴도는 것을 막기 위해),
      //      복잡한 길찾기 없이 플레이어를 향해 곧장 조향한다. (도로 밖 이탈 보정은 3번에서 그대로 적용됨)
      const distNowForSteer = turf.distance(
        turf.point([pc.lng, pc.lat]), turf.point([car.lng, car.lat]), { units: 'meters' }
      );
      if (distNowForSteer <= POLICE_DIRECT_CHASE_RANGE_M) {
        desiredBearing = turf.bearing(turf.point([pc.lng, pc.lat]), turf.point([car.lng, car.lat]));
        pc.route = null;        // 멀어지면 다시 정상적으로 경로를 새로 계산하도록 캐시를 비워둔다
        pc.routeIndex = 0;
        pc.routeRecalcTimer = 0;
      } else {
      // 2-a) 경로가 없거나, 다 왔거나, 재계산 주기가 됐으면 새로 길찾기를 시도한다.
      pc.routeRecalcTimer -= dt;
      const needsNewRoute = !pc.route || pc.routeIndex >= pc.route.length || pc.routeRecalcTimer <= 0;
      if (needsNewRoute) {
        const graph = getRoadGraphCached();
        const path = graph ? findRoutePath(graph, pc.lng, pc.lat, car.lng, car.lat, POLICE_ROUTE_START_SNAP_MAX_M) : null;
        pc.route = path;       // 못 찾으면 null → 아래에서 기존 직선 추격으로 자동 대체됨(안전장치)
        pc.routeIndex = 0;
        pc.routeRecalcTimer = POLICE_ROUTE_RECALC_INTERVAL_SEC;
      }

      if (pc.route && pc.routeIndex < pc.route.length) {
        // 2-b) 지금 향하는 웨이포인트에 충분히 가까워졌으면 다음 웨이포인트로 넘어감(여러 개를 한 번에 지나칠 수도 있음)
        let target = pc.route[pc.routeIndex];
        let dToTarget = turf.distance(turf.point([pc.lng, pc.lat]), turf.point(target), { units: 'meters' });
        while (dToTarget <= POLICE_ROUTE_WAYPOINT_ARRIVE_M && pc.routeIndex < pc.route.length - 1) {
          pc.routeIndex++;
          target = pc.route[pc.routeIndex];
          dToTarget = turf.distance(turf.point([pc.lng, pc.lat]), turf.point(target), { units: 'meters' });
        }
        desiredBearing = turf.bearing(turf.point([pc.lng, pc.lat]), turf.point(target));
      } else {
        // 길찾기가 실패한 경우(도로 데이터 없음/그래프 끊김 등)에 한해서만, 기존처럼 플레이어를 향한 직선 방향을 사용
        desiredBearing = turf.bearing(turf.point([pc.lng, pc.lat]), turf.point([car.lng, car.lat]));
      }
      }
    } else {
      pc.wanderTimer -= dt;
      if (pc.wanderTimer <= 0) {
        // 순찰 방향을 무작위로 새로 정함 (플레이어 위치와는 무관 - "전혀 내 위치를 모른 채" 돌아다님)
        pc.wanderHeading = pc.heading + (Math.random() * 2 - 1) * POLICE_WANDER_TURN_RANGE_DEG;
        pc.wanderTimer = POLICE_WANDER_MIN_INTERVAL_SEC + Math.random() * (POLICE_WANDER_MAX_INTERVAL_SEC - POLICE_WANDER_MIN_INTERVAL_SEC);
      }
      desiredBearing = pc.wanderHeading;
    }
    let hdiff = desiredBearing - pc.heading;
    hdiff = ((hdiff + 540) % 360) - 180;
    pc.heading = (pc.heading + Math.max(-maxTurn, Math.min(maxTurn, hdiff)) + 360) % 360;

    // 3) 후보 위치를 계산한 뒤, 도로 위인지 확인해서 도로 밖이면 도로 쪽으로 조향을 보정한다.
    //    - 주변에 도로 정보가 아예 없는 경우(강/공터 등)에는 "마지막으로 도로 위였던 위치" 쪽으로 되돌아간다.
    //    - 많이 벗어난 경우(OFFROAD_HARD_BLOCK_METERS 초과)에는 방향만 바뀔 뿐 전진 자체를 막는다.
    let headingRad = pc.heading * Math.PI / 180;
    let candLat = pc.lat + (pc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
    let candLng = pc.lng + (pc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;

    const roadInfo = findRoadPointNear(candLat, candLng, OFFROAD_DETECT_RANGE_METERS);
    const onRoad = roadInfo && roadInfo.dist <= ROAD_HALF_WIDTH_METERS * 3;
    const hardBlocked = roadInfo && roadInfo.dist > OFFROAD_HARD_BLOCK_METERS;

    if (!onRoad) {
      const targetLng = roadInfo ? roadInfo.lng : pc.lastGoodLng;
      const targetLat = roadInfo ? roadInfo.lat : pc.lastGoodLat;
      const toRoadBearing = turf.bearing(turf.point([candLng, candLat]), turf.point([targetLng, targetLat]));
      let hd2 = toRoadBearing - pc.heading;
      hd2 = ((hd2 + 540) % 360) - 180;
      pc.heading = (pc.heading + Math.max(-maxTurn, Math.min(maxTurn, hd2)) + 360) % 360;

      if (hardBlocked) {
        candLat = pc.lat;
        candLng = pc.lng;
      } else {
        headingRad = pc.heading * Math.PI / 180;
        candLat = pc.lat + (pc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
        candLng = pc.lng + (pc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;
      }
    } else {
      pc.lastGoodLat = candLat;
      pc.lastGoodLng = candLng;
    }
    pc.lat = candLat;
    pc.lng = candLng;

    // 4) 체포 판정: "추격" 상태일 때만 유효 (순찰 중에는 근처를 지나가도 붙잡히지 않음)
    //    - 반드시 "이번 프레임 이동을 마친 뒤"의 최종 위치로 다시 거리 계산 → 화면에 그려지는 원과
    //      정확히 같은 기준으로 판정해서, 눈에 보이는 것보다 넓게 잡히는 오차를 없앤다.
    const distToPlayerAfterMove = turf.distance(
      turf.point([pc.lng, pc.lat]), turf.point([car.lng, car.lat]), { units: 'meters' }
    );

    // 4-a) 경찰차 ↔ 플레이어 몸통 박치기(직접 충돌) 판정.
    //      큰 직선 도로에서는 경찰차가 플레이어보다 느려서 체포 범위(25m) 안으로 영원히 못 들어올 수 있는데,
    //      실제로 맞닿을 만큼 가까워지면 서로 강하게 튕겨나가게 해서 따돌리기만 하는 것을 막는다.
    if (pc.collisionCooldownTimer > 0) pc.collisionCooldownTimer -= dt;
    if (pc.stunTimer > 0) pc.stunTimer = Math.max(0, pc.stunTimer - dt);
    // 화면에 그려지는 아이콘 위치를 구할 때 쓰는 것과 완전히 동일한 함수(map.project)로
    // 두 차량의 "실제 화면 픽셀 좌표"를 구해서 그 사이의 픽셀 거리로 판정한다.
    // (줌 레벨→미터/픽셀 근사 공식을 쓰면 지도 라이브러리의 타일 크기 기준에 따라 실제 화면과
    //  어긋날 수 있어, 아이콘이 눈으로 보기엔 안 겹쳤는데도 충돌로 판정되는 오차가 생길 수 있었다.
    //  map.project()는 아이콘을 그릴 때 쓰는 좌표 변환과 100% 동일하므로 이런 오차가 있을 수 없다.)
    const playerScreenPt = map.project([car.lng, car.lat]);
    const pcScreenPtForHit = map.project([pc.lng, pc.lat]);
    const hitPixelDist = Math.hypot(playerScreenPt.x - pcScreenPtForHit.x, playerScreenPt.y - pcScreenPtForHit.y);
    const isPlayerCollision = hitPixelDist <= CAR_ICON_HIT_RADIUS_PX * 2;
    if (isPlayerCollision && !pc.wasCollidingWithPlayer && pc.collisionCooldownTimer <= 0) {
      // 방금 충돌한 순간(직전 프레임까진 맞닿지 않았음) → 경찰차 진행방향 기준 좌/우 어느 쪽에서
      // 부딪혔는지 계산해서, 두 차량이 서로 반대쪽 "뒤" 대각선으로 튕겨나가게 한다.
      const headingRadNow = pc.heading * Math.PI / 180;
      const dNorth = (car.lat - pc.lat) * metersPerDegLat;
      const dEast = (car.lng - pc.lng) * metersPerDegLng;
      const perp = -dNorth * Math.sin(headingRadNow) + dEast * Math.cos(headingRadNow);
      const side = perp >= 0 ? 1 : -1;

      // 충돌 "순간" 두 차량 모두 즉시 완전 정지 → 그 다음 정해진 시간(KNOCKBACK_DURATION_SEC) 동안
      // 조향/가속 입력을 무시하고 강제로 대각선 뒤쪽으로 밀려난다(넉백). 넉백이 끝나면 완전히 멈춘
      // 상태에서 다시 처음부터 가속해서 출발하게 되므로, "부딪혀서 밀려났다"는 느낌이 확실해진다.
      const playerKnockHeading = (car.heading + 180 + side * KNOCKBACK_ANGLE_DEG + 360) % 360;
      const policeKnockHeading = (pc.heading + 180 - side * KNOCKBACK_ANGLE_DEG + 360) % 360;

      car.speed = 0;
      car.heading = playerKnockHeading;
      car.knockbackHeading = playerKnockHeading;
      car.knockbackSpeed = KNOCKBACK_SPEED_MS;
      car.knockbackTimer = KNOCKBACK_DURATION_SEC;
      car.knockbackDuration = KNOCKBACK_DURATION_SEC;
      car.knockbackEndSpeed = 0; // 경찰차 충돌은 트럭과 달리 완전 정지까지 이즈아웃
      car.collisionAccelBoostTimer = PLAYER_POST_COLLISION_ACCEL_SECONDS; // 넉백이 끝난 뒤 재가속이 경찰차보다 훨씬 빠르게 이루어지도록

      pc.speed = 0;
      pc.heading = policeKnockHeading;
      pc.knockbackHeading = policeKnockHeading;
      pc.knockbackSpeed = KNOCKBACK_SPEED_MS;
      pc.knockbackTimer = KNOCKBACK_DURATION_SEC;
      pc.state = 'chase';
      pc.route = null;
      pc.routeIndex = 0;
      pc.routeRecalcTimer = 0;

      // 즉시 서로를 최소 거리만큼 떨어뜨려서(순간이동), 겹쳐진 채로 다음 프레임을 맞이하지 않게 한다.
      const sepRad = playerKnockHeading * Math.PI / 180;
      car.lat += (Math.cos(sepRad) * KNOCKBACK_SEPARATION_M) / metersPerDegLat;
      car.lng += (Math.sin(sepRad) * KNOCKBACK_SEPARATION_M) / metersPerDegLng;
      const sepRadPc = policeKnockHeading * Math.PI / 180;
      pc.lat += (Math.cos(sepRadPc) * KNOCKBACK_SEPARATION_M) / metersPerDegLat;
      pc.lng += (Math.sin(sepRadPc) * KNOCKBACK_SEPARATION_M) / metersPerDegLng;

      pc.collisionCooldownTimer = POLICE_COLLISION_HIT_COOLDOWN_SEC;
      pc.stunTimer = POLICE_COLLISION_STUN_SECONDS; // 이 시간 동안 체포 판정(빨간 원)이 사라짐. 단, 체포 카운트가 이미 진행 중이었다면 예외적으로 계속 판정됨(꼼수 방지)
    }
    pc.wasCollidingWithPlayer = isPlayerCollision;

    // 스턴(충돌 직후 5초) 중이라도, 이미 체포 카운트가 진행 중이었다면(caughtTimer > 0)
    // 판정에서 제외하지 않는다. → 체포되기 직전에 일부러 경찰차를 들이받아 카운트를
    // 0으로 되돌리는 꼼수를 막기 위함. (처음 마주쳐서 아직 카운트가 시작되지 않은
    // 상태에서 충돌한 경우에는 기존처럼 스턴 동안 판정에서 빠진다.)
    const catchEligibleDespiteStun = pc.stunTimer <= 0 || caughtTimer > 0;
    if (pc.state === 'chase' && catchEligibleDespiteStun && distToPlayerAfterMove <= CATCH_RADIUS_METERS) {
      playerInsideAnyCircle = true;
      catchSourcePos = { lat: pc.lat, lng: pc.lng, radiusMeters: CATCH_RADIUS_METERS, holdSeconds: CATCH_HOLD_SECONDS };
    }
    // 순찰 중이었다면, 이동을 마친 최종 위치 기준으로 탐지 범위(초록 원) 안에
    // 플레이어가 실제로 들어왔는지 확인한다 → 이 값이 6번에서 그려지는 원과 완전히 동일한 기준.
    if (pc.state === 'patrol' && distToPlayerAfterMove <= POLICE_DETECTION_RADIUS_METERS) {
      pendingDetect = true;
    }

    // 5) 너무 오래 플레이어에게서 멀리 떨어져 있으면 재배치한다.
    //    - 추격 중: "무전 네트워크"로 다른 차가 앞쪽에 새로 나타나는 것처럼 재배치 (기존과 동일)
    //    - 순찰 중: 플레이어 근처에서 계속 순찰이 이루어지도록, 너무 멀어지면 근처로 다시 재배치
    const giveupDistance = pc.state === 'chase' ? POLICE_GIVEUP_DISTANCE_M : POLICE_PATROL_MAX_DIST_M;
    if (distToPlayerAfterMove > giveupDistance) {
      pc.farTimer += dt;
      if (pc.farTimer >= POLICE_GIVEUP_HOLD_SECONDS) {
        redeployPoliceCar(pc);
        return; // 재배치 직후이므로 이번 프레임의 아이콘/원 갱신은 다음 프레임에 정상적으로 이루어짐
      }
    } else {
      pc.farTimer = 0;
    }

    // 6) 화면 좌표로 변환해서 경찰차 아이콘과 원(순찰=탐지범위 / 추격=체포범위)의 위치·크기를 갱신
    const screenPt = map.project([pc.lng, pc.lat]);
    pc.el.style.transform = `translate(${screenPt.x - 7}px, ${screenPt.y - 12}px) rotate(${pc.heading}deg)`;

    const radiusMeters = pc.state === 'chase' ? CATCH_RADIUS_METERS : POLICE_DETECTION_RADIUS_METERS;
    const diameterPx = 2 * metersToScreenPixels(pc.lat, pc.lng, radiusMeters);
    pc.circleEl.style.width = `${diameterPx}px`;
    pc.circleEl.style.height = `${diameterPx}px`;
    pc.circleEl.style.transform = `translate(${screenPt.x - diameterPx / 2}px, ${screenPt.y - diameterPx / 2}px)`;
    // 충돌 직후(스턴 중)에는 체포 판정 원을 잠시 감춰서, "부딪혀서 잠깐 서로 놓쳤다"는 느낌을 준다.
    // 단, 이미 체포 카운트가 진행 중이었다면(caughtTimer > 0) 실제로도 계속 잡혀 있는 것이므로
    // 원을 감추지 않고 그대로 보여준다(카운트가 계속 돌아가고 있음을 시각적으로도 알 수 있게).
    pc.circleEl.style.display = (pc.state === 'chase' && pc.stunTimer > 0 && caughtTimer <= 0) ? 'none' : '';

    // 7) 원을 다 그린 뒤에야 비로소 실제 상태 전환을 적용한다.
    //    → 유저는 방금 6번에서 그려진 "초록 탐지 원이 자기 차를 감싸고 있는" 화면을 실제로 보게 되고,
    //      그 다음 프레임부터 추격(빨간 원)으로 바뀐다.
    if (pendingDetect) {
      triggerDetected(pc, now);
    }
  });

  // 이번 프레임에 경찰차(추격 상태) 중 하나라도 플레이어를 체포 범위 안에 두고 있었는지 기록해둔다.
  // 실제 체포 타이머 누적/판정은 헬기 쪽 결과와 합쳐서 updateCatchStatus()에서 한 번에 처리한다.
  policeCarsCatchingPlayer = playerInsideAnyCircle;
}

// 경찰차 + 경찰 헬기 등 모든 추격 수단의 체포 판정을 한 곳에서 종합해서 처리한다.
// 여러 수단 중 하나라도 이번 프레임에 플레이어를 포위 범위 안에 두고 있으면 체포 타이머가 올라간다.
function updateCatchStatus(dt) {
  const catchWarning = document.getElementById('catch-warning');
  const isSurrounded = policeCarsCatchingPlayer || helicopterCatchingPlayer || truckCatchingPlayer;
  if (isSurrounded && catchSourcePos) {
    caughtTimer += dt;
    const holdSeconds = catchSourcePos.holdSeconds || CATCH_HOLD_SECONDS; // 소스별(경찰차/헬기) 체포 유지시간. 지정 안 돼있으면 기본값(경찰차 5초) 사용
    const remaining = Math.max(0, holdSeconds - caughtTimer);
    catchWarning.style.display = 'block';
    catchWarning.textContent = `경찰에게 포위됨! ${remaining.toFixed(1)}초 후 체포`;

    // 경고 문구를 체포 판정 중인 경찰차(또는 헬기)의 화면 좌표 바로 위에 띄운다.
    const srcPt = map.project([catchSourcePos.lng, catchSourcePos.lat]);
    const srcRadiusPx = metersToScreenPixels(catchSourcePos.lat, catchSourcePos.lng, catchSourcePos.radiusMeters);
    catchWarning.style.transform = `translate(${srcPt.x}px, ${srcPt.y - srcRadiusPx - 14}px) translate(-50%, -100%)`;

    if (caughtTimer >= holdSeconds) triggerCaught();
  } else {
    caughtTimer = 0;
    catchSourcePos = null;
    catchWarning.style.display = 'none';
  }
}

// 순찰 중이던 경찰차가 플레이어를 "발각"했을 때 호출: 추격 상태로 전환하고, 사이렌 + 배너를 띄운다.
function triggerDetected(pc, now) {
  pc.state = 'chase';
  pc.circleEl.classList.remove('mode-patrol');
  pc.circleEl.classList.add('mode-chase');
  // 방금 추격을 시작했으므로, 다음 프레임에 곧바로 도로 기반 경로를 새로 계산하게 한다.
  pc.route = null;
  pc.routeIndex = 0;
  pc.routeRecalcTimer = 0;

  playSirenBeep();

  const el = document.getElementById('detected-warning');
  el.textContent = '🚨 발각됨!'; // 헬기 출동 문구로 바뀌어 있었을 수 있으므로 일반 발각 문구로 되돌림
  el.style.display = 'block';
  detectedWarningHideAt = now + DETECTED_WARNING_DURATION_MS;
}

// 짧은 사이렌 효과음을 Web Audio API로 직접 생성해서 재생한다(별도 음원 파일 불필요).
function playSirenBeep() {
  try {
    if (!window.__policeAudioCtx) {
      window.__policeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const ctx = window.__policeAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();

    const startAt = ctx.currentTime;
    const duration = 0.55;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(ctx.destination);

    // 사이렌 특유의 오르내리는 음(우~이~ 우~이~)을 흉내낸 주파수 변화
    osc.frequency.setValueAtTime(650, startAt);
    osc.frequency.linearRampToValueAtTime(1000, startAt + 0.14);
    osc.frequency.linearRampToValueAtTime(650, startAt + 0.28);
    osc.frequency.linearRampToValueAtTime(1000, startAt + 0.42);
    osc.frequency.linearRampToValueAtTime(650, startAt + 0.55);

    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.linearRampToValueAtTime(0.28, startAt + 0.03);
    gain.gain.linearRampToValueAtTime(0.0001, startAt + duration);

    osc.start(startAt);
    osc.stop(startAt + duration + 0.05);
  } catch (e) {
    // 오디오 재생이 막힌 환경(자동재생 제한 등)이면 조용히 무시하고 게임은 계속 진행
  }
}

// 플레이어를 너무 오래 놓친 경찰차를, 플레이어가 "가고 있는 방향" 앞쪽 어딘가로 재배치한다.
// (실제로는 같은 차량 객체를 옮기는 것이지만, 플레이어 입장에서는 "무전 받은 새 경찰차가 앞에 나타난 것"처럼 보인다)
function redeployPoliceCar(pc) {
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);

  // 플레이어의 현재 진행 방향(heading) 기준으로, 좌우로 약간 퍼진 각도 + 앞쪽 거리를 여러 번 시도해
  // "실제로 도로 위인" 지점을 찾는다.
  let lat = null, lng = null, bearingDeg = car.heading;
  for (let attempt = 0; attempt < 25; attempt++) {
    const angleOffset = (Math.random() * 2 - 1) * POLICE_RESPAWN_ANGLE_SPREAD_DEG;
    const tryBearing = car.heading + angleOffset;
    const tryDist = POLICE_RESPAWN_AHEAD_MIN_M + Math.random() * (POLICE_RESPAWN_AHEAD_MAX_M - POLICE_RESPAWN_AHEAD_MIN_M);
    const bearingRad = tryBearing * Math.PI / 180;
    const tryLat = car.lat + (tryDist * Math.cos(bearingRad)) / metersPerDegLat;
    const tryLng = car.lng + (tryDist * Math.sin(bearingRad)) / metersPerDegLng;

    const roadInfo = findRoadPointNear(tryLat, tryLng, 35);
    if (roadInfo) {
      lat = roadInfo.lat;
      lng = roadInfo.lng;
      bearingDeg = tryBearing;
      break;
    }
  }
  // 그래도 못 찾았으면, 마지막으로 도로 위였던 자기 위치를 그대로 유지한다 (건물/강 위로 순간이동하지 않도록)
  if (lat === null) {
    lat = pc.lastGoodLat;
    lng = pc.lastGoodLng;
  }

  pc.lat = lat;
  pc.lng = lng;
  pc.heading = bearingDeg;
  pc.speed = 0;       // 새로 배치된 것처럼 정지 상태에서 다시 가속 시작
  pc.farTimer = 0;
  pc.lastGoodLat = lat;
  pc.lastGoodLng = lng;
  pc.wasCollidingWithPlayer = false;
  pc.collisionCooldownTimer = 0;
  pc.stunTimer = 0;
  pc.knockbackTimer = 0;
  pc.knockbackSpeed = 0;

  // 발각 시스템을 없앴으므로, 재배치된 차량도 순찰 없이 곧바로 다시 추격을 시작한다.
  pc.state = 'chase';
  pc.route = null;
  pc.routeIndex = 0;
  pc.routeRecalcTimer = 0;
  pc.wanderHeading = bearingDeg;
  pc.wanderTimer = POLICE_WANDER_MIN_INTERVAL_SEC + Math.random() * (POLICE_WANDER_MAX_INTERVAL_SEC - POLICE_WANDER_MIN_INTERVAL_SEC);
  pc.circleEl.classList.remove('mode-patrol');
  pc.circleEl.classList.add('mode-chase');
}

// 체포 확정: 모든 차량을 멈추고, "다시 도전하기" 버튼이 있는 오버레이를 띄운다.
function triggerCaught() {
  isCaught = true;
  car.speed = 0;
  policeCars.forEach((pc) => { pc.speed = 0; });
  specialTrucks.forEach((tc) => { tc.speed = 0; });
  if (policeHelicopter) policeHelicopter.speed = 0;
  document.getElementById('catch-warning').style.display = 'none';
  document.getElementById('caught-overlay').style.display = 'flex';
}

// 화면 위의 경찰차 DOM(아이콘 + 체포 원)을 모두 지우고, 배열도 비운다. 특수 트럭도 함께 정리한다.
function clearPoliceCars() {
  policeCars.forEach((pc) => {
    pc.el.remove();
    pc.circleEl.remove();
  });
  policeCars = [];
  caughtTimer = 0;
  policeCarsCatchingPlayer = false;
  removeSpecialTrucks();
  removeSpikeStrips();
  removeHelicopter();
  removeCivilianBlocker();
}

// 웨이브4에서 등장하는 특수 경찰 트럭들을 항상 TRUCK_COUNT(2)대 스폰한다.
// [특수능력] 트럭은 헬기처럼 도로/건물을 완전히 무시하고, 언제나 플레이어를 향해
// 최단 직선으로 아주 빠르게 곧장 돌진하는 "몸통 박치기 전용" 차량이다.
function spawnSpecialTrucks() {
  if (specialTrucks.length > 0) return; // 이미 있다면 중복 생성하지 않음
  for (let i = 0; i < TRUCK_COUNT; i++) {
    // 두 대가 겹쳐서 나오지 않도록, 서로 다른 방향(약 180도 간격 ± 무작위)에서 스폰한다.
    const baseBearing = i * (360 / TRUCK_COUNT) + (Math.random() * 40 - 20);
    spawnOneSpecialTruck(baseBearing);
  }
}

// 트럭 한 대를 플레이어 주변의 지정된 방향(baseBearing) 근처, 무작위 거리에 배치한다.
// 트럭은 건물/도로를 무시하고 자유롭게 움직이므로, 스폰 지점도 도로 여부를 따지지 않는다.
function spawnOneSpecialTruck(baseBearing) {
  const layer = document.getElementById('police-layer');
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);

  const dist = POLICE_SPAWN_MIN_DIST_M + Math.random() * (POLICE_SPAWN_MAX_DIST_M - POLICE_SPAWN_MIN_DIST_M);
  const bearingRad = baseBearing * Math.PI / 180;
  const lat = car.lat + (dist * Math.cos(bearingRad)) / metersPerDegLat;
  const lng = car.lng + (dist * Math.sin(bearingRad)) / metersPerDegLng;

  const el = document.createElement('div');
  el.className = 'police-truck';
  // 트럭은 일반 경찰차보다 훨씬 긴 직사각형 형태로 표현(진행방향 기준 세로로 긴 화물칸 + 앞쪽 캡)
  el.innerHTML = `
    <svg viewBox="0 0 34 90">
      <rect x="3" y="1" width="28" height="88" rx="4" fill="#3a3f4a" stroke="#14171d" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#1a2733" opacity="0.85"/>
      <rect class="police-light" x="9" y="28" width="16" height="6" rx="1.5" fill="#ff3b3b"/>
      <rect x="6" y="40" width="22" height="44" rx="2" fill="#4a5060" opacity="0.9"/>
    </svg>`;
  layer.appendChild(el);

  // [특수능력] 경찰차/헬기와 동일한 스타일의 빨간 체포 판정 원을 트럭에도 붙인다.
  const circleEl = document.createElement('div');
  circleEl.className = 'catch-circle mode-chase';
  layer.appendChild(circleEl);

  specialTrucks.push({
    lat, lng, heading: baseBearing, speed: 0,
    el, circleEl,
    wasCollidingWithPlayer: false,
    hitCooldownTimer: 0,
    state: 'chasing', // 'chasing'(플레이어를 향해 조향하며 추격) → 충돌 시 'breakthrough'(그 방향 그대로 직진해서 화면 밖으로 이탈)
  });
}

// 트럭 DOM(아이콘 + 체포 원)을 모두 지우고 배열을 비운다.
function removeSpecialTrucks() {
  specialTrucks.forEach((tc) => {
    tc.el.remove();
    tc.circleEl.remove();
  });
  specialTrucks = [];
  truckCatchingPlayer = false;
  truckRespawnTimer = 0;
}

// 특수 트럭들의 이동 + 플레이어와의 충돌/체포 판정을 처리한다.
// - [특수능력] 도로 위인지, 건물이 앞을 막는지는 전혀 신경 쓰지 않는다(헬기와 동일한 방식) →
//   지도 위 어디든 최단 직선으로 곧장 플레이어를 향해 아주 빠르게 돌진한다.
// - [돌파형] 정면 충돌 순간, 플레이어를 그 방향으로 강하게 튕겨내면서(속도도 100km/h만큼 깎아서 피해를 줌)
//   트럭 자신은 더 이상 맴돌지 않고 그대로 직진만 계속해서 화면 밖으로 완전히 빠져나간다.
//   화면 밖으로 나가면 그 트럭은 사라지고, 잠시 뒤 새 트럭이 다시 어딘가에서 돌진해온다.
// - [특수능력] "추격" 상태일 때만 경찰차와 동일한 빨간 원(체포 판정 범위)이 유효하다. 한 번 들이받고
//   "돌파" 상태가 된 트럭은 이미 스쳐 지나가는 중이므로 더 이상 체포 위협이 되지 않는다.
function updateSpecialTrucks(dt, now) {
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);
  const truckSpeed = car.maxForwardSpeed * TRUCK_SPEED_FACTOR;
  const maxTurn = TRUCK_STEER_RATE_DEG_PER_SEC * dt;

  let anyTruckCatching = false;
  const trucksToRemove = [];

  specialTrucks.forEach((tc) => {
    // 1) 속도: 최고 속도(플레이어보다 훨씬 빠름)를 향해 가속. 돌파 중에도 전속력을 유지해서 시원하게 빠져나간다.
    if (tc.speed < truckSpeed) tc.speed = Math.min(truckSpeed, tc.speed + car.accel * dt);
    else if (tc.speed > truckSpeed) tc.speed = Math.max(truckSpeed, tc.speed - car.accel * dt);

    // 2) 조향: "추격" 상태일 때만 플레이어를 향해 조향한다. "돌파" 상태가 되면 조향을 멈추고
    //    충돌 순간의 방향을 그대로 유지한 채 계속 직진만 한다(= 그대로 뚫고 지나가서 화면 밖으로 사라짐).
    if (tc.state === 'chasing') {
      const desiredBearing = turf.bearing(turf.point([tc.lng, tc.lat]), turf.point([car.lng, car.lat]));
      let hdiff = desiredBearing - tc.heading;
      hdiff = ((hdiff + 540) % 360) - 180;
      tc.heading = (tc.heading + Math.max(-maxTurn, Math.min(maxTurn, hdiff)) + 360) % 360;
    }

    // 3) 위치 이동: 도로 스냅/이탈 판정 없이 자유롭게(건물도 그대로 뚫고) 직진 이동
    const headingRad = tc.heading * Math.PI / 180;
    tc.lat += (tc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
    tc.lng += (tc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;

    // 4) 화면 좌표로 변환해서 트럭 아이콘 + 체포 판정 원의 위치/크기 갱신
    const screenPt = map.project([tc.lng, tc.lat]);
    tc.el.style.transform = `translate(${screenPt.x - 7}px, ${screenPt.y - 22}px) rotate(${tc.heading}deg)`;

    const diameterPx = 2 * metersToScreenPixels(tc.lat, tc.lng, TRUCK_CATCH_RADIUS_METERS);
    tc.circleEl.style.width = `${diameterPx}px`;
    tc.circleEl.style.height = `${diameterPx}px`;
    tc.circleEl.style.transform = `translate(${screenPt.x - diameterPx / 2}px, ${screenPt.y - diameterPx / 2}px)`;
    // 돌파 상태로 스쳐 지나가는 트럭은 더 이상 체포 위협이 아니므로 빨간 원을 숨긴다.
    tc.circleEl.style.display = tc.state === 'breakthrough' ? 'none' : '';

    const dNorth = (car.lat - tc.lat) * metersPerDegLat;
    const dEast = (car.lng - tc.lng) * metersPerDegLng;

    // 5) 몸통 박치기(직사각형) 충돌 판정: "추격" 상태에서 정면으로 부딪힌 바로 그 한 번만 처리한다.
    if (tc.state === 'chasing') {
      const headingRadNow = tc.heading * Math.PI / 180;
      // along: 트럭이 바라보는 방향으로 얼마나 앞/뒤에 있는지, perp: 그 방향의 좌/우로 얼마나 떨어져 있는지
      const along = dNorth * Math.cos(headingRadNow) + dEast * Math.sin(headingRadNow);
      const perp = -dNorth * Math.sin(headingRadNow) + dEast * Math.cos(headingRadNow);
      const isColliding = Math.abs(along) <= TRUCK_LENGTH_M / 2 && Math.abs(perp) <= TRUCK_WIDTH_M / 2;

      if (isColliding) {
        // 정면으로 들이받힌 순간 → 트럭은 이제부터 조향을 멈추고 이 방향 그대로 뚫고 지나가는
        // "돌파" 상태로 전환된다(위 2번 조향 로직에서 자동으로 직진만 하게 됨).
        tc.state = 'breakthrough';

        // [피해] 충돌 시점 속도(km/h)에서 100km/h만큼 깎는다(0 밑으로는 내려가지 않음).
        const preHitSpeedKmh = car.speed * 3.6;
        const endSpeedKmh = Math.max(0, preHitSpeedKmh - TRUCK_HIT_SPEED_DAMAGE_KMH);
        car.knockbackEndSpeed = endSpeedKmh / 3.6;

        // [강제 액션] 트럭이 뚫고 나가는 방향(tc.heading) 그대로 플레이어를 세게 튕겨낸다.
        car.knockbackHeading = tc.heading;
        car.knockbackSpeed = TRUCK_KNOCKBACK_SPEED_MS;
        car.knockbackTimer = TRUCK_KNOCKBACK_DURATION_SEC;
        car.knockbackDuration = TRUCK_KNOCKBACK_DURATION_SEC;
        car.collisionAccelBoostTimer = PLAYER_POST_COLLISION_ACCEL_SECONDS;
      }
    }

    // 6) 체포 판정: "추격" 상태일 때만 유효(경찰차/헬기와 동일한 방식). 돌파 중에는 판정하지 않는다.
    if (tc.state === 'chasing') {
      const distToPlayerAfterMove = turf.distance(
        turf.point([tc.lng, tc.lat]), turf.point([car.lng, car.lat]), { units: 'meters' }
      );
      if (distToPlayerAfterMove <= TRUCK_CATCH_RADIUS_METERS) {
        anyTruckCatching = true;
        catchSourcePos = { lat: tc.lat, lng: tc.lng, radiusMeters: TRUCK_CATCH_RADIUS_METERS, holdSeconds: TRUCK_CATCH_HOLD_SECONDS };
      }
    }

    // 7) 돌파 상태에서 플레이어로부터 충분히 멀어지면(화면 밖으로 완전히 빠져나가면) 제거 대상으로 표시한다.
    if (tc.state === 'breakthrough') {
      const distFromPlayer = Math.hypot(dNorth, dEast);
      if (distFromPlayer >= TRUCK_BREAKTHROUGH_DESPAWN_DIST_M) {
        trucksToRemove.push(tc);
      }
    }
  });

  // 화면 밖으로 완전히 빠져나간 트럭을 지우고, 잠시 뒤 새 트럭이 다시 돌진해오도록 예약한다.
  if (trucksToRemove.length > 0) {
    trucksToRemove.forEach((tc) => {
      tc.el.remove();
      tc.circleEl.remove();
    });
    specialTrucks = specialTrucks.filter((tc) => !trucksToRemove.includes(tc));
    if (truckRespawnTimer <= 0) truckRespawnTimer = TRUCK_RESPAWN_DELAY_SEC;
  }

  // 트럭 대수가 TRUCK_COUNT보다 모자라면(누군가 돌파해서 나갔다면), 일정 시간 뒤 그 자리를 채울
  // 새 트럭을 다시 등장시킨다. (이 함수는 currentWave>=4이기만 하면 매 프레임 호출되므로, 트럭이
  // 하나도 남지 않은 순간에도 재등장 타이머가 계속 흘러간다)
  if (specialTrucks.length < TRUCK_COUNT) {
    if (truckRespawnTimer > 0) {
      truckRespawnTimer = Math.max(0, truckRespawnTimer - dt);
      if (truckRespawnTimer <= 0) {
        spawnOneSpecialTruck(Math.random() * 360);
      }
    } else {
      truckRespawnTimer = TRUCK_RESPAWN_DELAY_SEC;
    }
  }

  truckCatchingPlayer = anyTruckCatching;
}


// 플레이어 근처(minDist~maxDist, m) 도로 위의 한 지점을 찾는다. 못 찾으면 플레이어가 서 있는 도로 근처로 폴백.
// (경찰차 최초 스폰, 트럭 스폰 로직과 동일한 탐색 방식 - 민간 차량 스폰/재배치에 공용으로 사용)
function findNearPlayerRoadSpot(minDist, maxDist) {
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);
  for (let attempt = 0; attempt < 25; attempt++) {
    const tryBearing = Math.random() * 360;
    const tryDist = minDist + Math.random() * (maxDist - minDist);
    const bearingRad = tryBearing * Math.PI / 180;
    const tryLat = car.lat + (tryDist * Math.cos(bearingRad)) / metersPerDegLat;
    const tryLng = car.lng + (tryDist * Math.sin(bearingRad)) / metersPerDegLng;
    const roadInfo = findRoadPointNear(tryLat, tryLng, 35);
    if (roadInfo) {
      return { lat: roadInfo.lat, lng: roadInfo.lng, bearingDeg: tryBearing };
    }
  }
  const fallback = findRoadPointNear(car.lat, car.lng, 200) || { lat: car.lat, lng: car.lng };
  return { lat: fallback.lat, lng: fallback.lng, bearingDeg: car.heading };
}

// 웨이브6부터 등장하는 "길막" 민간 차량(녹색)을 플레이어 아주 가까운 도로 위에 배치한다.
// - 경찰차/트럭과 달리 추격·체포 개념이 전혀 없다: 그냥 자기 갈 길 가는 민간 차량일 뿐이며,
//   플레이어와 우연히 부딪히면 서로 튕겨나가는 "길막" 역할만 한다.
function spawnCivilianBlocker() {
  if (civilianBlocker) return; // 이미 있다면 중복 생성하지 않음
  const layer = document.getElementById('police-layer');
  const spot = findNearPlayerRoadSpot(CIVILIAN_SPAWN_MIN_DIST_M, CIVILIAN_SPAWN_MAX_DIST_M);

  const el = document.createElement('div');
  el.className = 'civilian-car';
  // 경찰차와 같은 차체 모양이되, 경광등 없이 녹색으로만 칠해서 "일반 민간 차량"임을 드러낸다.
  el.innerHTML = `
    <svg viewBox="0 0 34 58">
      <path d="M17 1 C25 1 30 8 30 18 L30 46 C30 53 25 57 17 57 C9 57 4 53 4 46 L4 18 C4 8 9 1 17 1 Z"
            fill="#2e9e44" stroke="#155c26" stroke-width="1.5"/>
      <rect x="8" y="12" width="18" height="14" rx="3" fill="#1a2733" opacity="0.85"/>
      <rect x="8" y="34" width="18" height="12" rx="3" fill="#1a2733" opacity="0.6"/>
    </svg>`;
  layer.appendChild(el);

  civilianBlocker = {
    lat: spot.lat, lng: spot.lng, heading: spot.bearingDeg, speed: 0,
    el,
    lastGoodLat: spot.lat, lastGoodLng: spot.lng,
    wanderHeading: spot.bearingDeg,
    wanderTimer: POLICE_WANDER_MIN_INTERVAL_SEC + Math.random() * (POLICE_WANDER_MAX_INTERVAL_SEC - POLICE_WANDER_MIN_INTERVAL_SEC),
    route: null,          // 도로 그래프를 따라가는 현재 경로(웨이포인트 배열). 없으면 wander로 대체
    routeIndex: 0,
    routeRecalcTimer: 0,  // 0 이하가 되면 새로운 무작위 목적지를 다시 정함
    wasCollidingWithPlayer: false,
    collisionCooldownTimer: 0,
    knockbackTimer: 0,
    knockbackHeading: 0,
    knockbackSpeed: 0,
  };
}

// 민간 길막 차량 DOM을 지우고 상태를 초기화한다.
function removeCivilianBlocker() {
  if (civilianBlocker) {
    civilianBlocker.el.remove();
    civilianBlocker = null;
  }
}

// 민간 길막 차량의 이동(도로 그래프를 따라 자유 주행) + 플레이어와의 충돌(맞박치기) 판정을 처리한다.
// - 발각/추격/체포 개념이 전혀 없는, 순수한 "지나가던 일반 차량"이다.
// - 플레이어와 몸통이 맞닿으면 경찰차와 동일한 방식으로 서로 반대쪽 대각선으로 튕겨나간다(길막 효과).
// - 플레이어에게서 너무 멀어지면(CIVILIAN_RESPAWN_DIST_M) 계속 "근처의 교통"으로 남아있도록
//   플레이어 근처 도로로 재배치한다(멀리 가버려서 다시는 안 보이는 상황을 방지).
function updateCivilianBlocker(dt, now) {
  const cc = civilianBlocker;
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);

  // 0) 플레이어와 너무 멀어졌으면, "길막"으로서의 존재감을 유지하도록 플레이어 근처로 재배치
  const distFromPlayer = turf.distance(turf.point([cc.lng, cc.lat]), turf.point([car.lng, car.lat]), { units: 'meters' });
  if (distFromPlayer > CIVILIAN_RESPAWN_DIST_M) {
    const spot = findNearPlayerRoadSpot(CIVILIAN_SPAWN_MIN_DIST_M, CIVILIAN_SPAWN_MAX_DIST_M);
    cc.lat = spot.lat; cc.lng = spot.lng; cc.heading = spot.bearingDeg;
    cc.lastGoodLat = spot.lat; cc.lastGoodLng = spot.lng;
    cc.speed = 0;
    cc.route = null; cc.routeIndex = 0; cc.routeRecalcTimer = 0;
    cc.knockbackTimer = 0;
  }

  // 넉백(충돌로 튕겨나가는 중)인 동안은 나머지 로직을 전부 건너뛰고, 강제로 밀려나는 이동만 처리한다.
  if (cc.knockbackTimer > 0) {
    cc.knockbackTimer = Math.max(0, cc.knockbackTimer - dt);
    const kt = cc.knockbackTimer / KNOCKBACK_DURATION_SEC; // 1 → 0으로 이즈아웃
    cc.speed = cc.knockbackSpeed * kt;
    cc.heading = cc.knockbackHeading;
    const headingRad = cc.heading * Math.PI / 180;
    cc.lat += (cc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
    cc.lng += (cc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;
    if (cc.knockbackTimer <= 0) cc.speed = 0;

    const screenPtKb = map.project([cc.lng, cc.lat]);
    cc.el.style.transform = `translate(${screenPtKb.x - 7}px, ${screenPtKb.y - 12}px) rotate(${cc.heading}deg)`;
    if (cc.collisionCooldownTimer > 0) cc.collisionCooldownTimer -= dt;
    cc.wasCollidingWithPlayer = false; // 넉백이 끝난 뒤 다음 정상 프레임에 충돌 여부를 새로 감지하게 함
    return;
  }

  const civSpeedTarget = car.maxForwardSpeed * CIVILIAN_SPEED_FACTOR;
  const maxTurn = POLICE_STEER_RATE_DEG_PER_SEC * dt;

  // 1) 속도: 목표 속도(평범한 교통 흐름 속도)를 향해 가속/감속
  if (cc.speed < civSpeedTarget) cc.speed = Math.min(civSpeedTarget, cc.speed + car.accel * dt);
  else if (cc.speed > civSpeedTarget) cc.speed = Math.max(civSpeedTarget, cc.speed - car.accel * dt);

  // 2) 조향: 실제 도로망(그래프)을 따라가는 무작위 목적지로 이동(트럭과 동일한 방식)
  let desiredBearing;
  cc.routeRecalcTimer -= dt;
  const needsNewRoute = !cc.route || cc.routeIndex >= cc.route.length || cc.routeRecalcTimer <= 0;
  if (needsNewRoute) {
    const graph = buildRoadGraph();
    let path = null;
    if (graph && graph.nodeCoord.size > 0) {
      const keys = Array.from(graph.nodeCoord.keys());
      const randKey = keys[Math.floor(Math.random() * keys.length)];
      const target = graph.nodeCoord.get(randKey);
      path = findRoutePath(graph, cc.lng, cc.lat, target[0], target[1], CIVILIAN_ROUTE_START_SNAP_MAX_M);
    }
    cc.route = path; // 못 찾으면 null → 아래에서 wander 방식으로 자동 대체(안전장치)
    cc.routeIndex = 0;
    cc.routeRecalcTimer = CIVILIAN_ROUTE_RECALC_INTERVAL_SEC;
  }

  if (cc.route && cc.routeIndex < cc.route.length) {
    let target = cc.route[cc.routeIndex];
    let dToTarget = turf.distance(turf.point([cc.lng, cc.lat]), turf.point(target), { units: 'meters' });
    while (dToTarget <= CIVILIAN_ROUTE_WAYPOINT_ARRIVE_M && cc.routeIndex < cc.route.length - 1) {
      cc.routeIndex++;
      target = cc.route[cc.routeIndex];
      dToTarget = turf.distance(turf.point([cc.lng, cc.lat]), turf.point(target), { units: 'meters' });
    }
    desiredBearing = turf.bearing(turf.point([cc.lng, cc.lat]), turf.point(target));
  } else {
    cc.wanderTimer -= dt;
    if (cc.wanderTimer <= 0) {
      cc.wanderHeading = cc.heading + (Math.random() * 2 - 1) * POLICE_WANDER_TURN_RANGE_DEG;
      cc.wanderTimer = POLICE_WANDER_MIN_INTERVAL_SEC + Math.random() * (POLICE_WANDER_MAX_INTERVAL_SEC - POLICE_WANDER_MIN_INTERVAL_SEC);
    }
    desiredBearing = cc.wanderHeading;
  }
  let hdiff = desiredBearing - cc.heading;
  hdiff = ((hdiff + 540) % 360) - 180;
  cc.heading = (cc.heading + Math.max(-maxTurn, Math.min(maxTurn, hdiff)) + 360) % 360;

  // 3) 후보 위치 계산 후, 도로 위인지 확인해서 벗어나면 도로 쪽으로 보정(경찰차/트럭과 동일한 방식)
  let headingRad = cc.heading * Math.PI / 180;
  let candLat = cc.lat + (cc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
  let candLng = cc.lng + (cc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;

  const roadInfo = findRoadPointNear(candLat, candLng, OFFROAD_DETECT_RANGE_METERS);
  const onRoad = roadInfo && roadInfo.dist <= ROAD_HALF_WIDTH_METERS * 3;
  const hardBlocked = roadInfo && roadInfo.dist > OFFROAD_HARD_BLOCK_METERS;

  if (!onRoad) {
    const targetLng = roadInfo ? roadInfo.lng : cc.lastGoodLng;
    const targetLat = roadInfo ? roadInfo.lat : cc.lastGoodLat;
    const toRoadBearing = turf.bearing(turf.point([candLng, candLat]), turf.point([targetLng, targetLat]));
    let hd2 = toRoadBearing - cc.heading;
    hd2 = ((hd2 + 540) % 360) - 180;
    cc.heading = (cc.heading + Math.max(-maxTurn, Math.min(maxTurn, hd2)) + 360) % 360;

    if (hardBlocked) {
      candLat = cc.lat;
      candLng = cc.lng;
    } else {
      headingRad = cc.heading * Math.PI / 180;
      candLat = cc.lat + (cc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
      candLng = cc.lng + (cc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;
    }
  } else {
    cc.lastGoodLat = candLat;
    cc.lastGoodLng = candLng;
  }
  cc.lat = candLat;
  cc.lng = candLng;

  // 4) 화면 좌표로 변환해서 아이콘 위치/각도 갱신
  const screenPt = map.project([cc.lng, cc.lat]);
  cc.el.style.transform = `translate(${screenPt.x - 7}px, ${screenPt.y - 12}px) rotate(${cc.heading}deg)`;

  // 5) 플레이어와의 충돌(맞박치기) 판정: 경찰차와 동일한 방식(둘 다 서로 반대편 대각선으로 튕겨나감)
  if (cc.collisionCooldownTimer > 0) cc.collisionCooldownTimer -= dt;

  const playerScreenPt = map.project([car.lng, car.lat]);
  const ccScreenPtForHit = map.project([cc.lng, cc.lat]);
  const hitPixelDist = Math.hypot(playerScreenPt.x - ccScreenPtForHit.x, playerScreenPt.y - ccScreenPtForHit.y);
  const isPlayerCollision = hitPixelDist <= CAR_ICON_HIT_RADIUS_PX * 2;

  if (isPlayerCollision && !cc.wasCollidingWithPlayer && cc.collisionCooldownTimer <= 0) {
    // 방금 충돌한 순간 → 경찰차와 완전히 동일한 방식으로, 서로 반대쪽 대각선 뒤로 튕겨나간다.
    const headingRadNow = cc.heading * Math.PI / 180;
    const dNorth = (car.lat - cc.lat) * metersPerDegLat;
    const dEast = (car.lng - cc.lng) * metersPerDegLng;
    const perp = -dNorth * Math.sin(headingRadNow) + dEast * Math.cos(headingRadNow);
    const side = perp >= 0 ? 1 : -1;

    const playerKnockHeading = (car.heading + 180 + side * KNOCKBACK_ANGLE_DEG + 360) % 360;
    const civKnockHeading = (cc.heading + 180 - side * KNOCKBACK_ANGLE_DEG + 360) % 360;

    car.speed = 0;
    car.heading = playerKnockHeading;
    car.knockbackHeading = playerKnockHeading;
    car.knockbackSpeed = KNOCKBACK_SPEED_MS;
    car.knockbackTimer = KNOCKBACK_DURATION_SEC;
    car.knockbackDuration = KNOCKBACK_DURATION_SEC;
    car.knockbackEndSpeed = 0; // 민간 차량 충돌도 완전 정지까지 이즈아웃
    car.collisionAccelBoostTimer = PLAYER_POST_COLLISION_ACCEL_SECONDS;

    cc.speed = 0;
    cc.heading = civKnockHeading;
    cc.knockbackHeading = civKnockHeading;
    cc.knockbackSpeed = KNOCKBACK_SPEED_MS;
    cc.knockbackTimer = KNOCKBACK_DURATION_SEC;
    cc.route = null;
    cc.routeIndex = 0;
    cc.routeRecalcTimer = 0;

    // 즉시 서로를 최소 거리만큼 떨어뜨려서, 겹쳐진 채로 다음 프레임을 맞이하지 않게 한다.
    const sepRad = playerKnockHeading * Math.PI / 180;
    car.lat += (Math.cos(sepRad) * KNOCKBACK_SEPARATION_M) / metersPerDegLat;
    car.lng += (Math.sin(sepRad) * KNOCKBACK_SEPARATION_M) / metersPerDegLng;
    const sepRadCc = civKnockHeading * Math.PI / 180;
    cc.lat += (Math.cos(sepRadCc) * KNOCKBACK_SEPARATION_M) / metersPerDegLat;
    cc.lng += (Math.sin(sepRadCc) * KNOCKBACK_SEPARATION_M) / metersPerDegLng;

    cc.collisionCooldownTimer = POLICE_COLLISION_HIT_COOLDOWN_SEC;
  }
  cc.wasCollidingWithPlayer = isPlayerCollision;
}

// 스파이크 스트립 하나를 플레이어 주변의 무작위 방향/거리에 있는 도로 위에 배치한다.
function spawnSpikeStrip() {
  const layer = document.getElementById('police-layer');
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);

  let lat = null, lng = null;
  for (let attempt = 0; attempt < 25; attempt++) {
    const tryBearing = Math.random() * 360;
    const tryDist = SPIKE_STRIP_MIN_DIST_M + Math.random() * (SPIKE_STRIP_MAX_DIST_M - SPIKE_STRIP_MIN_DIST_M);
    const bearingRad = tryBearing * Math.PI / 180;
    const tryLat = car.lat + (tryDist * Math.cos(bearingRad)) / metersPerDegLat;
    const tryLng = car.lng + (tryDist * Math.sin(bearingRad)) / metersPerDegLng;

    const roadInfo = findRoadPointNear(tryLat, tryLng, 35);
    if (roadInfo) {
      lat = roadInfo.lat;
      lng = roadInfo.lng;
      break;
    }
  }
  if (lat === null) {
    const fallback = findRoadPointNear(car.lat, car.lng, 200) || { lat: car.lat, lng: car.lng };
    lat = fallback.lat;
    lng = fallback.lng;
  }

  const el = document.createElement('div');
  el.className = 'spike-strip';
  el.innerHTML = `
    <svg viewBox="0 0 44 20">
      <rect x="1" y="8" width="42" height="5" rx="2" fill="#caa23a" stroke="#5c4a1a" stroke-width="1"/>
      <polygon points="5,8 8,1 11,8" fill="#e8e8e8" stroke="#888" stroke-width="0.5"/>
      <polygon points="15,8 18,1 21,8" fill="#e8e8e8" stroke="#888" stroke-width="0.5"/>
      <polygon points="25,8 28,1 31,8" fill="#e8e8e8" stroke="#888" stroke-width="0.5"/>
      <polygon points="35,8 38,1 41,8" fill="#e8e8e8" stroke="#888" stroke-width="0.5"/>
    </svg>`;
  layer.appendChild(el);

  spikeStrips.push({ lat, lng, el, hitCooldownTimer: 0, wasOnPlayer: false });
}

// 웨이브5 시작 시, 스파이크 스트립을 SPIKE_STRIP_COUNT개 만큼 도로 곳곳에 뿌린다.
function spawnSpikeStrips() {
  for (let i = 0; i < SPIKE_STRIP_COUNT; i++) {
    spawnSpikeStrip();
  }
}

// 스파이크 스트립을 하나 다른 위치(플레이어 주변 도로)로 재배치한다.
// - 한 번 밟혔거나, 플레이어에게서 너무 멀어졌을 때 호출해서 계속 "도로 곳곳에 뿌려진" 상태를 유지한다.
function relocateSpikeStrip(strip) {
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);
  let lat = null, lng = null;
  for (let attempt = 0; attempt < 25; attempt++) {
    const tryBearing = Math.random() * 360;
    const tryDist = SPIKE_STRIP_MIN_DIST_M + Math.random() * (SPIKE_STRIP_MAX_DIST_M - SPIKE_STRIP_MIN_DIST_M);
    const bearingRad = tryBearing * Math.PI / 180;
    const tryLat = car.lat + (tryDist * Math.cos(bearingRad)) / metersPerDegLat;
    const tryLng = car.lng + (tryDist * Math.sin(bearingRad)) / metersPerDegLng;

    const roadInfo = findRoadPointNear(tryLat, tryLng, 35);
    if (roadInfo) {
      lat = roadInfo.lat;
      lng = roadInfo.lng;
      break;
    }
  }
  if (lat !== null) {
    strip.lat = lat;
    strip.lng = lng;
  }
  strip.wasOnPlayer = false;
}

// 화면 위의 모든 스파이크 스트립 DOM을 지우고 배열을 비운다.
function removeSpikeStrips() {
  spikeStrips.forEach((s) => s.el.remove());
  spikeStrips = [];
}

// 매 프레임 스파이크 스트립들의 화면 위치를 갱신하고, 플레이어가 밟았는지 확인해서
// 밟았다면 순간적으로 속도를 -40km/h 깎은 뒤 다른 곳으로 재배치한다.
function updateSpikeStrips(dt) {
  spikeStrips.forEach((strip) => {
    if (strip.hitCooldownTimer > 0) strip.hitCooldownTimer -= dt;

    const screenPt = map.project([strip.lng, strip.lat]);
    strip.el.style.transform = `translate(${screenPt.x - 13}px, ${screenPt.y - 6}px)`;

    const distToPlayer = turf.distance(
      turf.point([strip.lng, strip.lat]), turf.point([car.lng, car.lat]), { units: 'meters' }
    );
    const isOnPlayer = distToPlayer <= SPIKE_STRIP_TRIGGER_RADIUS_M;

    if (isOnPlayer && !strip.wasOnPlayer && strip.hitCooldownTimer <= 0) {
      // 방금 밟은 순간(직전 프레임까진 밟지 않았음) → 순간적으로 속도를 깎는다
      if (car.speed > 0) {
        car.speed = Math.max(0, car.speed - SPIKE_STRIP_SPEED_DROP_MS);
      } else if (car.speed < 0) {
        car.speed = Math.min(0, car.speed + SPIKE_STRIP_SPEED_DROP_MS);
      }
      strip.hitCooldownTimer = SPIKE_STRIP_HIT_COOLDOWN_SEC;
      relocateSpikeStrip(strip); // 밟힌 스트립은 다른 곳으로 옮겨서 계속 도로 곳곳에 함정이 있게 유지
    } else if (distToPlayer > SPIKE_STRIP_MAX_DIST_FROM_PLAYER_M) {
      // 플레이어가 너무 멀리 가버렸으면, 마주칠 일이 없어지지 않도록 근처로 다시 뿌린다
      relocateSpikeStrip(strip);
    }
    strip.wasOnPlayer = isOnPlayer;
  });
}

// 웨이브6에서 등장하는 경찰 헬기를 하나 만들어 플레이어 주변 무작위 방향/거리에 배치한다.
// 자동차/트럭과 달리 "도로 위인지"는 전혀 신경 쓰지 않는다(하늘에서 접근하므로).
function spawnHelicopter(now) {
  if (policeHelicopter) return; // 이미 있다면 중복 생성하지 않음
  const layer = document.getElementById('police-layer');
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);

  const bearingDeg = Math.random() * 360;
  const dist = HELICOPTER_SPAWN_MIN_DIST_M + Math.random() * (HELICOPTER_SPAWN_MAX_DIST_M - HELICOPTER_SPAWN_MIN_DIST_M);
  const bearingRad = bearingDeg * Math.PI / 180;
  const lat = car.lat + (dist * Math.cos(bearingRad)) / metersPerDegLat;
  const lng = car.lng + (dist * Math.sin(bearingRad)) / metersPerDegLng;

  const el = document.createElement('div');
  el.className = 'police-helicopter';
  el.innerHTML = `
    <svg viewBox="0 0 40 40">
      <line class="heli-rotor" x1="2" y1="4" x2="38" y2="4" stroke="#222" stroke-width="2"/>
      <rect x="18" y="2" width="4" height="4" fill="#222"/>
      <ellipse cx="20" cy="23" rx="9" ry="13" fill="#2b3038" stroke="#0d0f12" stroke-width="1.5"/>
      <ellipse cx="20" cy="19" rx="6" ry="7" fill="#1a2733" opacity="0.85"/>
      <rect class="police-light" x="15" y="31" width="10" height="4" rx="1.5" fill="#ff3b3b"/>
      <rect x="18" y="35" width="4" height="4" fill="#222"/>
    </svg>`;
  layer.appendChild(el);

  // 경찰차와 동일한 스타일(추격 모드 = 빨간 원)의 체포 판정 원을 헬기 전용으로 하나 만든다.
  const circleEl = document.createElement('div');
  circleEl.className = 'catch-circle mode-chase';
  layer.appendChild(circleEl);

  policeHelicopter = {
    lat, lng, heading: bearingDeg, speed: 0,
    el, circleEl,
  };

  // 등장을 알리는 사이렌 + "발각됨!" 배너를 재사용해 헬기 출동을 알린다.
  playSirenBeep();
  const bannerEl = document.getElementById('detected-warning');
  if (bannerEl) {
    bannerEl.textContent = '🚁 경찰 헬기 출동!';
    bannerEl.style.display = 'block';
    detectedWarningHideAt = now + DETECTED_WARNING_DURATION_MS;
  }
}

// 헬기 DOM(아이콘 + 체포 판정 원)을 지우고 상태를 초기화한다.
function removeHelicopter() {
  if (policeHelicopter) {
    policeHelicopter.el.remove();
    policeHelicopter.circleEl.remove();
    policeHelicopter = null;
  }
  helicopterCatchingPlayer = false;
}

// 경찰 헬기의 이동을 처리한다.
// - 자동차/트럭과 달리 도로를 따라갈 필요가 없으므로, 길찾기나 도로 이탈 보정 없이
//   매 프레임 플레이어를 향한 최단 직선 방향으로 그냥 곧장 날아간다(건물도 무시하고 통과).
// - 대신 최고 속도는 항상 플레이어의 최고 속도보다 낮게 고정(HELICOPTER_SPEED_FACTOR < 1)해서,
//   플레이어가 계속 최고 속도로 잘 도망치면 결국 따돌릴 수 있다.
function updateHelicopter(dt, now) {
  const hc = policeHelicopter;
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320 * Math.cos(car.lat * Math.PI / 180);
  // 웨이브3+ 배율(policeWaveSpeedMultiplier)은 일부러 적용하지 않는다 - 헬기가 배율까지 받으면
  // 플레이어 최고 속도를 넘어설 수 있기 때문에, "플레이어보다 빠르지 않다"는 조건을 항상 지키기 위함.
  const helicopterSpeed = car.maxForwardSpeed * HELICOPTER_SPEED_FACTOR;
  const maxTurn = HELICOPTER_STEER_RATE_DEG_PER_SEC * dt;

  // 1) 속도: 목표 속도(플레이어 최고 속도보다 살짝 느림)를 향해 가속/감속
  if (hc.speed < helicopterSpeed) hc.speed = Math.min(helicopterSpeed, hc.speed + car.accel * dt);
  else if (hc.speed > helicopterSpeed) hc.speed = Math.max(helicopterSpeed, hc.speed - car.accel * dt);

  // 2) 조향: 언제나 플레이어가 있는 방향으로 곧장 조향(도로 여부와 무관)
  const desiredBearing = turf.bearing(turf.point([hc.lng, hc.lat]), turf.point([car.lng, car.lat]));
  let hdiff = desiredBearing - hc.heading;
  hdiff = ((hdiff + 540) % 360) - 180;
  hc.heading = (hc.heading + Math.max(-maxTurn, Math.min(maxTurn, hdiff)) + 360) % 360;

  // 3) 위치 이동: 도로 스냅/이탈 판정 없이 자유롭게(하늘 위이므로) 직진 이동
  const headingRad = hc.heading * Math.PI / 180;
  hc.lat += (hc.speed * dt * Math.cos(headingRad)) / metersPerDegLat;
  hc.lng += (hc.speed * dt * Math.sin(headingRad)) / metersPerDegLng;

  // 4) 화면 좌표로 변환해서 헬기 아이콘과 체포 판정 원의 위치/크기를 갱신
  const screenPt = map.project([hc.lng, hc.lat]);
  hc.el.style.transform = `translate(${screenPt.x - 20}px, ${screenPt.y - 20}px) rotate(${hc.heading}deg)`;

  const diameterPx = 2 * metersToScreenPixels(hc.lat, hc.lng, HELICOPTER_CATCH_RADIUS_METERS);
  hc.circleEl.style.width = `${diameterPx}px`;
  hc.circleEl.style.height = `${diameterPx}px`;
  hc.circleEl.style.transform = `translate(${screenPt.x - diameterPx / 2}px, ${screenPt.y - diameterPx / 2}px)`;

  // 5) 체포 판정: 이번 프레임 이동을 마친 뒤의 최종 위치 기준으로 판정(화면에 그려진 원과 정확히 일치시킴)
  const distToPlayerAfterMove = turf.distance(
    turf.point([hc.lng, hc.lat]), turf.point([car.lng, car.lat]), { units: 'meters' }
  );
  helicopterCatchingPlayer = distToPlayerAfterMove <= HELICOPTER_CATCH_RADIUS_METERS;
  if (helicopterCatchingPlayer) {
    catchSourcePos = { lat: hc.lat, lng: hc.lng, radiusMeters: HELICOPTER_CATCH_RADIUS_METERS, holdSeconds: HELICOPTER_CATCH_HOLD_SECONDS };
  }
}

// 페이지를 새로고침하지 않고, 지정된 위치/방향에서 게임을 다시 시작한다.
// (경찰차 초기화 → 자유 주행 카운트다운부터 다시 진행)
// 페이지를 새로고침하지 않고, 지정된 위치/방향에서 게임을 다시 시작한다.
// (경찰차 초기화 → 자유 주행 카운트다운부터 다시 진행)
// keepProgress가 true면 "이어서 계속(탈출)" 버튼용: 점수와 웨이브를 그대로 유지한다.
// keepProgress가 false(기본값)면 완전히 새로 시작하는 것이므로 점수/웨이브를 처음으로 되돌린다.
function restartGameAt(lat, lng, heading, keepProgress = false) {
  clearPoliceCars();

  car.lat = lat;
  car.lng = lng;
  car.heading = heading;
  car.speed = 0;
  car.knockbackTimer = 0;
  car.knockbackSpeed = 0;
  car.knockbackEndSpeed = 0;
  throttleMode = 'forward';
  setThrottle('forward'); // 버튼 표시도 "전진"으로 동기화

  // 이탈 패널티 상태 초기화
  offroadPenaltyState = 'none';
  offroadPenaltyTimer = 0;
  wasOffRoad = false;

  if (!keepProgress) {
    // 완전히 새로 시작하는 경우에만 점수와 웨이브를 처음으로 되돌린다.
    score = 0;
    scoreHud.textContent = '점수: 0';

    currentWave = 1;
    policeWaveSpeedMultiplier = 1;
    waveHud.textContent = '1웨이브';
  }
  // keepProgress가 true인 경우(이어서 계속) score/currentWave/policeWaveSpeedMultiplier와
  // 그에 맞는 HUD 표시는 잡히기 직전 값 그대로 유지된다.

  document.getElementById('catch-warning').style.display = 'none';
  document.getElementById('caught-overlay').style.display = 'none';

  map.jumpTo({ center: [car.lng, car.lat] }); // 다음 프레임을 기다리지 않고 즉시 화면 중심을 옮김

  isCaught = false;
  startPoliceCountdown(); // 자유 주행 카운트다운부터 다시 시작 (gameLoop는 계속 돌고 있으므로 별도 재시작 불필요)
}

document.getElementById('restart-here-btn').addEventListener('click', () => {
  // "이어서 계속 (탈출)": 방금 붙잡힌 바로 그 위치에서, 점수와 웨이브를 그대로 유지한 채 다시 시작
  restartGameAt(car.lat, car.lng, car.heading, true);
});

document.getElementById('restart-start-btn').addEventListener('click', () => {
  // "현 지도에서 처음부터 다시 하기": 이번 세션이 시작된 위치(현재 위치/국내 랜덤/해외 수도 중
  // 선택했던 곳)로 되돌아가서, 점수와 웨이브도 처음(0점/1웨이브)부터 다시 시작
  restartGameAt(initialLat ?? car.lat, initialLng ?? car.lng, initialHeading, false);
});

document.getElementById('restart-main-btn').addEventListener('click', () => {
  // 완전히 처음(위치 권한 화면)으로: 페이지를 새로고침한다
  location.reload();
});

</script>
</body>
</html>
